<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Smasholic · Badminton Court Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',system-ui,sans-serif; }
    :root {
      --purple: #7c3aed;
      --purple-light: #f5f3ff;
      --purple-dark: #6d28d9;
      --yellow: #f59e0b;
      --yellow-light: #fffbeb;
      --yellow-dark: #d97706;
      --bg: #fafaf9;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --sub: #6e6e73;
      --border: #f0f0f2;
      --danger: #ef4444;
      --success: #10b981;
    }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 20px 0;
      overscroll-behavior: none;
      -webkit-user-select: none;
    }
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .app-header {
      background: var(--card-bg);
      padding: 16px 16px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.92);
    }
    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .app-header .logo-icon { font-size: 1.8rem; }
    .app-content {
      flex: 1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
      border: 1px solid var(--border);
    }
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 500;
      font-size: 0.75rem;
      margin-bottom: 4px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    input, textarea {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: #fafaf9;
      color: var(--text);
      outline: none;
      transition: 0.15s;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
      background: #fff;
    }
    button {
      background: var(--purple);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(124,58,237,0.2);
    }
    button:active { transform: scale(0.97); }
    button.secondary {
      background: #f5f5f7;
      color: var(--text);
      box-shadow: none;
      border: 1px solid var(--border);
    }
    button.danger {
      background: #fef2f2;
      color: var(--danger);
      box-shadow: none;
      border: 1px solid #fecaca;
    }
    button.warning {
      background: var(--yellow-light);
      color: var(--yellow-dark);
      box-shadow: none;
      border: 1px solid #fde68a;
    }
    .players-section { margin: 12px 0 6px; }
    .section-title {
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 10px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Swipe row wrapper */
    .swipe-row {
      position: relative;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 14px;
    }
    .swipe-row .player-row {
      position: relative;
      z-index: 2;
      background: #fff;
      border: 1px solid var(--border);
      transition: transform 0.2s ease;
      will-change: transform;
      touch-action: pan-y; /* allow vertical scroll */
    }
    .swipe-row .delete-action {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 80px;
      background: var(--danger);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 0 14px 14px 0;
      z-index: 1;
      cursor: pointer;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 14px;
      max-width: 100%;
      overflow: hidden;
    }
    .player-row .num {
      font-weight: 600;
      width: 22px;
      color: var(--purple);
      flex-shrink: 0;
      font-size: 0.9rem;
      text-align: center;
    }
    .player-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid transparent;
      padding: 8px 6px;
      border-radius: 10px;
      background: transparent;
      font-size: 0.9rem;
    }
    .player-row input:focus {
      border-color: var(--purple);
      background: #fff;
    }
    .player-row .paid-btn, .player-row .remove-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      font-size: 1.1rem;
      padding: 0;
      cursor: pointer;
      background: #f9f9f9;
      border: 1px solid var(--border);
      color: #a1a1a6;
      transition: 0.15s;
    }
    .player-row .paid-btn.paid {
      background: var(--yellow-light);
      border-color: var(--yellow);
      color: var(--yellow-dark);
    }
    .player-row .remove-btn { border: none; display: none; } /* hidden behind swipe */
    .player-row.duplicate input { border-color: #fecaca; background: #fff5f5; }
    .actions-row {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0;
    }
    .actions-row button { flex: 1 1 auto; }
    .preview-box {
      background: #f9f9f9;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      font-family: 'SF Mono', 'Cascadia Code', monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      overflow-x: auto;
      color: var(--text);
      line-height: 1.5;
      max-height: 300px;
    }
    .booking-list-item {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hidden { display: none !important; }
    .auto-add-row {
      display: flex; align-items: center; gap: 8px; flex: 1;
    }
    .auto-add-row input { width: 70px; text-align: center; }
    .total-hours {
      font-size: 0.8rem; color: var(--purple); font-weight: 600;
      margin: 4px 0; display: flex; align-items: center; gap: 4px;
    }
    .duplicate-warning {
      color: var(--danger); font-size: 0.75rem; display: none; align-items: center; gap: 4px; margin-top: 6px;
    }
    .duplicate-warning.active { display: flex; }
    .import-modal {
      position: fixed; top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .import-modal .modal-content {
      background: #fff; border-radius: 24px; padding: 20px; width: 100%; max-width: 420px;
    }
    /* Autocomplete dropdown */
    .autocomplete-list {
      position: absolute;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      z-index: 30;
      max-height: 200px;
      overflow-y: auto;
      width: calc(100% - 56px); /* minus number and buttons width roughly */
      left: 28px;
      top: 100%;
      margin-top: 4px;
      display: none;
    }
    .autocomplete-list.active { display: block; }
    .autocomplete-list .autocomplete-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #f0f0f2;
    }
    .autocomplete-list .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-list .autocomplete-item:hover, .autocomplete-list .autocomplete-item:active {
      background: var(--purple-light);
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="app-header">
    <h1><span class="logo-icon">🏸</span> Smasholic</h1>
  </div>
  <div class="app-content">
    <!-- Booking form card -->
    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label>📆 Date</label>
          <input type="date" id="dateInput">
        </div>
        <div class="form-group">
          <label>Day (auto)</label>
          <input type="text" id="dayInput" readonly>
        </div>
        <div class="form-group">
          <label>⏰ Start</label>
          <input type="time" id="startTime" value="21:30">
        </div>
        <div class="form-group">
          <label>End</label>
          <input type="time" id="endTime" value="23:30">
        </div>
        <div class="form-group">
          <label>⏱️ Total</label>
          <div class="total-hours"><span id="totalHours">2.0 hours</span></div>
        </div>
        <div class="form-group">
          <label>🏟️ Venue</label>
          <input type="text" id="venue" value="Forum Sba, Setia Alam">
        </div>
        <div class="form-group">
          <label>Court</label>
          <input type="text" id="court" value="Rubber Court 6 & 7">
        </div>
        <div class="form-group">
          <label>💵 Price (RM)</label>
          <input type="number" id="price" value="17" step="0.5">
        </div>
        <div class="form-group">
          <label>🏸 Shuttle</label>
          <input type="text" id="shuttle" value="RSL">
        </div>
        <div class="form-group">
          <label>👤 Host</label>
          <input type="text" id="host" placeholder="Your name">
        </div>
      </div>

      <!-- Players -->
      <div class="players-section">
        <div class="section-title">👥 Players</div>
        <div id="playersContainer"></div>
        <div class="duplicate-warning" id="duplicateWarning">⚠️ Duplicate name!</div>

        <div class="actions-row">
          <button class="secondary" id="addPlayerBtn" style="flex:1;">+ Add Slot</button>
          <div class="auto-add-row" style="flex:1;">
            <input type="number" id="autoAddCount" placeholder="6" min="1" value="6">
            <button id="autoAddBtn" class="secondary" style="flex:1;">Auto</button>
          </div>
        </div>
        <div class="actions-row">
          <button id="clearPlayersBtn" class="warning" style="flex:1;">Clear</button>
          <button id="resetSessionBtn" class="danger" style="flex:1;">Reset</button>
        </div>
      </div>

      <div class="actions-row">
        <button id="copyBtn" class="secondary" style="flex:1;">📋 Copy</button>
        <button id="saveBookingBtn" style="flex:1;">💾 Save</button>
        <button id="importBtn" class="secondary" style="flex:1;">📥 Import</button>
      </div>

      <div>
        <div class="section-title">📄 Announcement</div>
        <div class="preview-box" id="preview"></div>
      </div>
    </div>

    <!-- Saved bookings -->
    <div class="card">
      <h3 style="font-size:0.95rem; font-weight:600; margin-bottom:10px;">📂 Saved Sessions</h3>
      <div id="savedBookingsList"></div>
      <p id="noBookingsMsg" style="color:#a1a1a6; font-size:0.8rem; text-align:center; padding:12px;">No saved sessions yet</p>
      <button id="clearAllBtn" class="danger" style="width:100%; margin-top:10px;">Clear All</button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div id="importModal" class="import-modal hidden">
  <div class="modal-content">
    <h3 style="font-weight:600; margin-bottom:12px;">📥 Paste Announcement</h3>
    <textarea id="importTextarea" placeholder="Paste the full announcement..."></textarea>
    <div style="display:flex; gap:8px; margin-top:14px; justify-content:flex-end;">
      <button id="importCancelBtn" class="secondary">Cancel</button>
      <button id="importParseBtn">Parse & Fill</button>
    </div>
    <p id="importError" style="color:var(--danger); font-size:0.8rem; margin-top:8px; display:none;"></p>
  </div>
</div>

<script>
  (function() {
    // DOM elements
    const dateInput = document.getElementById('dateInput');
    const dayInput = document.getElementById('dayInput');
    const startTime = document.getElementById('startTime');
    const endTime = document.getElementById('endTime');
    const totalHoursSpan = document.getElementById('totalHours');
    const venue = document.getElementById('venue');
    const court = document.getElementById('court');
    const price = document.getElementById('price');
    const shuttle = document.getElementById('shuttle');
    const host = document.getElementById('host');
    const playersContainer = document.getElementById('playersContainer');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const autoAddCount = document.getElementById('autoAddCount');
    const autoAddBtn = document.getElementById('autoAddBtn');
    const clearPlayersBtn = document.getElementById('clearPlayersBtn');
    const resetSessionBtn = document.getElementById('resetSessionBtn');
    const duplicateWarning = document.getElementById('duplicateWarning');
    const previewDiv = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const saveBookingBtn = document.getElementById('saveBookingBtn');
    const savedBookingsList = document.getElementById('savedBookingsList');
    const noBookingsMsg = document.getElementById('noBookingsMsg');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const importBtn = document.getElementById('importBtn');
    const importModal = document.getElementById('importModal');
    const importTextarea = document.getElementById('importTextarea');
    const importCancelBtn = document.getElementById('importCancelBtn');
    const importParseBtn = document.getElementById('importParseBtn');
    const importError = document.getElementById('importError');

    let players = [];

    // ---------- Name autocomplete ----------
    const NAMES_STORAGE_KEY = 'smasholic_used_names';
    function getUsedNames() { try { return JSON.parse(localStorage.getItem(NAMES_STORAGE_KEY)) || []; } catch { return []; } }
    function addUsedName(name) {
      if (!name.trim()) return;
      const names = getUsedNames().filter(n => n.toLowerCase() !== name.trim().toLowerCase());
      names.unshift(name.trim());
      if (names.length > 30) names.pop(); // keep list manageable
      localStorage.setItem(NAMES_STORAGE_KEY, JSON.stringify(names));
    }

    function showAutocomplete(input, idx) {
      // Close any existing dropdowns
      document.querySelectorAll('.autocomplete-list').forEach(el => el.remove());

      const value = input.value.trim();
      if (!value) return;
      const names = getUsedNames().filter(n => n.toLowerCase().includes(value.toLowerCase()));
      if (names.length === 0) return;

      const list = document.createElement('div');
      list.className = 'autocomplete-list active';
      names.forEach(name => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.textContent = name;
        item.addEventListener('mousedown', (e) => {
          e.preventDefault(); // prevent blur
          input.value = name;
          players[idx].name = name;
          updateDuplicateStyling();
          updatePreview();
          list.remove();
          addUsedName(name);
        });
        list.appendChild(item);
      });

      // Position relative to the player row
      const row = input.closest('.player-row');
      const swipeRow = input.closest('.swipe-row');
      if (row) {
        row.style.position = 'relative';
        row.appendChild(list);
      }
    }

    // ---------- Swipe-to-delete ----------
    function addSwipeListeners() {
      document.querySelectorAll('.swipe-row').forEach(swipeRow => {
        const playerRow = swipeRow.querySelector('.player-row');
        const idx = parseInt(swipeRow.dataset.idx);
        let startX = 0, currentX = 0, isDragging = false;

        function resetSwipe() {
          playerRow.style.transform = '';
          swipeRow.dataset.swiped = 'false';
        }

        playerRow.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          isDragging = true;
        }, { passive: true });

        playerRow.addEventListener('touchmove', (e) => {
          if (!isDragging) return;
          currentX = e.touches[0].clientX;
          const diff = startX - currentX;
          if (diff > 0) {
            e.preventDefault();
            playerRow.style.transition = 'none';
            playerRow.style.transform = `translateX(-${Math.min(diff, 80)}px)`;
          }
        }, { passive: false });

        playerRow.addEventListener('touchend', (e) => {
          if (!isDragging) return;
          isDragging = false;
          const diff = startX - currentX;
          playerRow.style.transition = '';
          if (diff > 40) {
            // swipe far enough: delete
            playerRow.style.transform = 'translateX(-100%)';
            playerRow.style.opacity = '0';
            setTimeout(() => {
              players.splice(idx, 1);
              renderPlayers();
              updatePreview();
            }, 200);
          } else {
            resetSwipe();
          }
        });

        // Also delete on tap of the red delete button (if visible)
        const deleteBtn = swipeRow.querySelector('.delete-action');
        if (deleteBtn) {
          deleteBtn.addEventListener('click', () => {
            players.splice(idx, 1);
            renderPlayers();
            updatePreview();
          });
        }
      });
    }

    // ---------- Helpers ----------
    function format12Hour(t) {
      if (!t) return "";
      const [h, m] = t.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return "";
      const ampm = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
    }

    function formatDateDMY(d) {
      if (!d) return "";
      const [y, m, day] = d.split('-');
      return `${parseInt(day)}/${parseInt(m)}/${y}`;
    }

    function getDayFromDate(d) {
      if (!d) return "";
      const date = new Date(d + "T00:00:00");
      const days = ["AHAD","ISNIN","SELASA","RABU","KHAMIS","JUMAAT","SABTU"];
      return days[date.getDay()];
    }

    function updateTotalHours() {
      const s = startTime.value;
      const e = endTime.value;
      if (!s || !e) { totalHoursSpan.textContent = '—'; return; }
      const [sh, sm] = s.split(':').map(Number);
      const [eh, em] = e.split(':').map(Number);
      if (isNaN(sh) || isNaN(sm) || isNaN(eh) || isNaN(em)) { totalHoursSpan.textContent = '—'; return; }
      let startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin <= startMin) endMin += 24 * 60;
      const diffMin = endMin - startMin;
      const hours = diffMin / 60;
      totalHoursSpan.textContent = (hours % 1 === 0) ? `${hours} hour(s)` : `${hours.toFixed(1)} hours`;
    }

    // Init date
    const today = new Date().toISOString().slice(0,10);
    dateInput.value = today;
    dayInput.value = getDayFromDate(today);
    dateInput.addEventListener('change', () => dayInput.value = getDayFromDate(dateInput.value));
    startTime.addEventListener('input', () => { updateTotalHours(); updatePreview(); });
    endTime.addEventListener('input', () => { updateTotalHours(); updatePreview(); });
    updateTotalHours();

    const savedAutoCount = localStorage.getItem('smasholic_autoCount');
    if (savedAutoCount) autoAddCount.value = savedAutoCount;

    // Duplicate detection
    function findDuplicates() {
      const names = players.map(p => p.name.trim().toLowerCase()).filter(n => n);
      const dups = new Set();
      const seen = new Set();
      names.forEach(n => { if (seen.has(n)) dups.add(n); else seen.add(n); });
      return dups;
    }

    function updateDuplicateStyling() {
      const dups = findDuplicates();
      let hasDup = false;
      const rows = playersContainer.querySelectorAll('.swipe-row');
      rows.forEach(row => {
        const idx = parseInt(row.dataset.idx);
        const player = players[idx];
        if (!player) return;
        const nameLow = player.name.trim().toLowerCase();
        const isDup = nameLow !== '' && dups.has(nameLow);
        row.querySelector('.player-row').classList.toggle('duplicate', isDup);
        if (isDup) hasDup = true;
      });
      duplicateWarning.classList.toggle('active', hasDup);
    }

    function renderPlayers() {
      playersContainer.innerHTML = '';
      const dups = findDuplicates();
      players.forEach((p, idx) => {
        const swipeRow = document.createElement('div');
        swipeRow.className = 'swipe-row';
        swipeRow.dataset.idx = idx;
        const isDup = p.name.trim().toLowerCase() !== '' && dups.has(p.name.trim().toLowerCase());

        swipeRow.innerHTML = `
          <div class="player-row ${isDup ? 'duplicate' : ''}">
            <span class="num">${idx+1}.</span>
            <input type="text" class="pname" value="${escapeHtml(p.name)}" placeholder="Name" data-idx="${idx}" autocomplete="off">
            <button class="paid-btn ${p.paid?'paid':''}" data-idx="${idx}">✅</button>
            <button class="remove-btn" data-idx="${idx}" style="display:none;">✕</button>
          </div>
          <div class="delete-action">Delete</div>
        `;
        playersContainer.appendChild(swipeRow);
      });

      attachPlayerEvents();
      addSwipeListeners();
      duplicateWarning.classList.toggle('active', dups.size > 0);
    }

    function attachPlayerEvents() {
      // Name inputs – autocomplete + live update
      document.querySelectorAll('.pname').forEach(inp => {
        const idx = parseInt(inp.dataset.idx);
        // remove existing listeners by cloning
        const newInp = inp.cloneNode(true);
        inp.parentNode.replaceChild(newInp, inp);
        newInp.addEventListener('input', function(e) {
          const i = parseInt(this.dataset.idx);
          players[i].name = this.value;
          updateDuplicateStyling();
          updatePreview();
          showAutocomplete(this, i);
        });
        newInp.addEventListener('blur', () => {
          // slight delay to allow click on autocomplete
          setTimeout(() => {
            const list = newInp.parentNode.querySelector('.autocomplete-list');
            if (list) list.remove();
          }, 150);
        });
        newInp.addEventListener('focus', function() {
          if (this.value.trim()) showAutocomplete(this, parseInt(this.dataset.idx));
        });
      });

      // Paid toggle
      document.querySelectorAll('.paid-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const i = parseInt(this.dataset.idx);
          players[i].paid = !players[i].paid;
          // add name to used names if not empty
          if (players[i].name.trim()) addUsedName(players[i].name.trim());
          renderPlayers();
          updatePreview();
        });
      });

      // Remove button (still present as fallback, though swipe is primary)
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const i = parseInt(this.dataset.idx);
          players.splice(i, 1);
          renderPlayers();
          updatePreview();
        });
      });
    }

    addPlayerBtn.onclick = () => { players.push({name:"",paid:false}); renderPlayers(); updatePreview(); };
    autoAddBtn.onclick = () => {
      let n = parseInt(autoAddCount.value);
      if (isNaN(n) || n<1) { alert("Enter a valid number"); return; }
      if (n>100) n=100;
      localStorage.setItem('smasholic_autoCount', n);
      for (let i=0; i<n; i++) players.push({name:"",paid:false});
      renderPlayers(); updatePreview(); autoAddCount.value = '';
    };
    clearPlayersBtn.onclick = () => {
      if (players.length && confirm('Remove all players?')) { players=[]; renderPlayers(); updatePreview(); }
    };
    resetSessionBtn.onclick = () => {
      if (confirm('Reset session? Venue will be kept.')) {
        const t = new Date().toISOString().slice(0,10);
        dateInput.value = t; dayInput.value = getDayFromDate(t);
        startTime.value = "21:30"; endTime.value = "23:30"; updateTotalHours();
        court.value = ""; price.value = ""; shuttle.value = ""; host.value = "";
        players = []; renderPlayers(); updatePreview();
      }
    };

    // Preview
    function buildPreviewText() {
      const d = formatDateDMY(dateInput.value) || ".........";
      const day = dayInput.value || ".......";
      const s = format12Hour(startTime.value) || ".....";
      const e = format12Hour(endTime.value) || ".....";
      const v = venue.value || "................";
      const c = court.value || "................";
      const pr = price.value || "0";
      const sh = shuttle.value || "......";
      const h = host.value.trim() || "......";
      const totalText = totalHoursSpan.textContent;
      const totalLine = (totalText !== '—') ? `⏱️ Total: ${totalText}\n` : '';

      let txt = `📆 : ${d} , ${day}\n`;
      txt += `⏰ : ${s} - ${e}\n`;
      txt += totalLine;
      txt += `🏟️ : ${v}\n        (${c})\n`;
      txt += `💵 : RM${pr} Per player\n\n`;
      txt += `🏸: Shuttle: ${sh}\n\n`;
      txt += `Done payment sila tick ✅ ‼️\n\n`;
      txt += `Host ${h}\n\n`;
      players.forEach((p,i) => {
        const name = p.name.trim() || "(Open)";
        txt += `${i+1}. ${name}${p.paid?'✅️':''}\n`;
      });
      return txt;
    }

    function updatePreview() { previewDiv.innerHTML = `<pre>${buildPreviewText()}</pre>`; }

    copyBtn.onclick = async () => {
      const txt = buildPreviewText();
      try { await navigator.clipboard.writeText(txt); alert("✅ Copied!"); }
      catch { const ta = document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert("✅ Copied!"); }
    };

    // Import
    importBtn.onclick = () => {
      importModal.classList.remove('hidden');
      importTextarea.value = '';
      importError.style.display = 'none';
      importTextarea.focus();
    };
    importCancelBtn.onclick = () => importModal.classList.add('hidden');

    function parseTime12to24(str) {
      const match = str.match(/^(\d{1,2})\.(\d{2})(am|pm)$/i);
      if (!match) return null;
      let h = parseInt(match[1]);
      const m = match[2];
      const period = match[3].toLowerCase();
      if (period === 'pm' && h !== 12) h += 12;
      if (period === 'am' && h === 12) h = 0;
      return `${h.toString().padStart(2,'0')}:${m}`;
    }

    function parseDMYtoYMD(str) {
      const parts = str.split('/');
      if (parts.length !== 3) return null;
      return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
    }

    importParseBtn.onclick = () => {
      const raw = importTextarea.value.trim();
      importError.style.display = 'none';
      if (!raw) { importError.textContent = 'Please paste an announcement.'; importError.style.display = 'block'; return; }

      try {
        const lines = raw.split('\n').map(l => l.trim()).filter(l => l);
        let parsedDate='', parsedDay='', parsedStart='', parsedEnd='', parsedVenue='', parsedCourt='', parsedPrice='', parsedShuttle='', parsedHost='';
        const parsedPlayers = [];
        for (let i=0; i<lines.length; i++) {
          const line = lines[i];
          if (line.startsWith('📆')) {
            const m = line.match(/📆\s*:\s*(.+?)\s*,\s*(.+)/);
            if (m) { const ymd = parseDMYtoYMD(m[1].trim()); if(ymd) parsedDate=ymd; parsedDay=m[2].trim(); }
          } else if (line.startsWith('⏰')) {
            const m = line.match(/⏰\s*:\s*(.+?)\s*-\s*(.+)/);
            if (m) { const s24=parseTime12to24(m[1].trim()); if(s24) parsedStart=s24; const e24=parseTime12to24(m[2].trim()); if(e24) parsedEnd=e24; }
          } else if (line.startsWith('🏟️')) {
            const m = line.match(/🏟️\s*:\s*(.+)/);
            if (m) parsedVenue=m[1].trim();
            if (i+1<lines.length && lines[i+1].startsWith('(')) {
              const cm = lines[i+1].match(/\((.+)\)/);
              if (cm) parsedCourt=cm[1].trim();
              i++;
            }
          } else if (line.startsWith('💵')) {
            const m = line.match(/💵\s*:\s*RM([\d.]+)/);
            if (m) parsedPrice=m[1];
          } else if (line.startsWith('🏸')) {
            const m = line.match(/🏸:\s*Shuttle:\s*(.+)/);
            if (m) parsedShuttle=m[1].trim();
          } else if (line.startsWith('Host ')) {
            const m = line.match(/^Host\s+(.+)/);
            if (m) parsedHost=m[1].trim();
          } else if (/^\d+\./.test(line)) {
            const m = line.match(/^(\d+)\.\s*(.+)$/);
            if (m) {
              let name = m[2].trim();
              const paid = name.endsWith('✅️') || name.endsWith('✅');
              if (paid) name = name.slice(0, - (name.endsWith('✅️')?2:1)).trim();
              if (name === '(Open)') name = '';
              parsedPlayers.push({ name, paid });
            }
          }
        }
        if (parsedDate) { dateInput.value = parsedDate; dayInput.value = parsedDay || getDayFromDate(parsedDate); }
        if (parsedStart) startTime.value = parsedStart;
        if (parsedEnd) endTime.value = parsedEnd;
        updateTotalHours();
        if (parsedVenue) venue.value = parsedVenue;
        if (parsedCourt) court.value = parsedCourt;
        if (parsedPrice) price.value = parsedPrice;
        if (parsedShuttle) shuttle.value = parsedShuttle;
        if (parsedHost) host.value = parsedHost;
        players = parsedPlayers.length ? parsedPlayers : [];
        renderPlayers();
        updatePreview();
        importModal.classList.add('hidden');
      } catch {
        importError.textContent = 'Invalid format. Please check the announcement.';
        importError.style.display = 'block';
      }
    };

    // Save/Load (localStorage)
    const STORAGE_KEY = 'smasholic_sessions';
    function getSessions() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; } catch { return []; } }
    function saveSessions(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
    function addSession(data) { const s = getSessions(); s.push(data); saveSessions(s); renderSaved(); }
    function deleteSession(i) { const s = getSessions(); s.splice(i,1); saveSessions(s); renderSaved(); }
    function renderSaved() {
      const sessions = getSessions();
      savedBookingsList.innerHTML = '';
      if (!sessions.length) { noBookingsMsg.classList.remove('hidden'); return; }
      noBookingsMsg.classList.add('hidden');
      sessions.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'booking-list-item';
        div.innerHTML = `
          <div style="flex:1;"><strong>📅 ${s.date||''} ${s.day||''}</strong><br><small>${escapeHtml(s.text.split('\n').slice(0,3).join(' | '))}</small></div>
          <div style="display:flex; gap:6px;">
            <button class="secondary load-session" data-idx="${idx}" style="padding:8px 12px;">Load</button>
            <button class="danger delete-session" data-idx="${idx}" style="padding:8px 12px;">Del</button>
          </div>
        `;
        savedBookingsList.appendChild(div);
      });
      document.querySelectorAll('.load-session').forEach(b => b.onclick = () => {
        const s = getSessions()[b.dataset.idx];
        if (s) loadSession(s);
      });
      document.querySelectorAll('.delete-session').forEach(b => b.onclick = () => {
        if (confirm('Delete session?')) deleteSession(b.dataset.idx);
      });
    }
    function loadSession(s) {
      dateInput.value = s.date || ''; dayInput.value = s.day || '';
      startTime.value = s.start || ''; endTime.value = s.end || ''; updateTotalHours();
      venue.value = s.venue || ''; court.value = s.court || ''; price.value = s.price || '';
      shuttle.value = s.shuttle || ''; host.value = s.host || '';
      players = s.players ? JSON.parse(JSON.stringify(s.players)) : [];
      renderPlayers(); updatePreview(); window.scrollTo({top:0,behavior:'smooth'});
    }
    saveBookingBtn.onclick = () => {
      addSession({
        date: dateInput.value, day: dayInput.value, start: startTime.value, end: endTime.value,
        venue: venue.value, court: court.value, price: price.value, shuttle: shuttle.value,
        host: host.value, players: JSON.parse(JSON.stringify(players)),
        text: buildPreviewText(), savedAt: new Date().toISOString()
      });
      alert("💾 Session saved!");
    };
    clearAllBtn.onclick = () => { if (confirm('Delete all saved sessions?')) { localStorage.removeItem(STORAGE_KEY); renderSaved(); } };

    function escapeHtml(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // Start
    renderPlayers();
    updatePreview();
    renderSaved();
  })();
</script>
</body>
</html>
