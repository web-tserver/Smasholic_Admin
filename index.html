<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🏸 Badminton Slot Booking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f0f4f8 0%, #e9eff5 100%);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-weight: 700;
      font-size: 1.6rem;
      color: #1a1a1a;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }
    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.02);
      margin-bottom: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 500px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .form-group.full {
        grid-column: span 2;
      }
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: #444;
      letter-spacing: 0.2px;
    }
    input, textarea, select {
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #f9fbfd;
      transition: all 0.2s ease;
      color: #1a1a1a;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #1677ff;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(22,119,255,0.1);
    }
    button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 12px rgba(22,119,255,0.2);
      -webkit-tap-highlight-color: transparent;
    }
    button:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(22,119,255,0.2);
    }
    button.secondary {
      background: #f0f4ff;
      color: #1677ff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(22,119,255,0.15);
    }
    button.secondary:active {
      background: #e6f0ff;
    }
    button.danger {
      background: #ff4d4f;
      box-shadow: 0 4px 12px rgba(255,77,79,0.2);
    }
    button.warning {
      background: #fa8c16;
      box-shadow: 0 4px 12px rgba(250,140,22,0.2);
    }
    .players-section {
      margin: 20px 0 10px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      border: 1px solid #f0f0f0;
      transition: all 0.15s;
    }
    .player-row:active {
      background: #fafafa;
    }
    .player-row .num {
      font-weight: 700;
      width: 22px;
      color: #1677ff;
      font-size: 0.9rem;
      text-align: center;
      flex-shrink: 0;
    }
    .player-row input {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      min-width: 0;
    }
    .player-row input:focus {
      border-color: #1677ff;
      background: #fff;
    }
    .player-row .paid-btn {
      background: white;
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      color: #999;
      min-width: 42px;
      flex-shrink: 0;
    }
    .player-row .paid-btn.paid {
      background: #e6fffb;
      border-color: #13c2c2;
      color: #13c2c2;
    }
    .player-row .remove-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .player-row .remove-btn:active {
      background: #fff1f0;
      color: #ff4d4f;
    }
    .player-row.duplicate input {
      border-color: #ff4d4f;
      background: #fff2f0;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }
    .actions button {
      flex: 1 1 auto;
    }
    .preview-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #eef2f6;
      margin-top: 12px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #1e293b;
      font-size: 0.85rem;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
      overflow-x: auto;
    }
    .booking-list-item {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 4px solid #1677ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 6px rgba(0,0,0,0.02);
      flex-wrap: wrap;
      gap: 8px;
    }
    .booking-list-item .info {
      font-size: 0.85rem;
      word-break: break-word;
    }
    .hidden {
      display: none !important;
    }
    .auto-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .auto-add-row input {
      width: 70px;
      text-align: center;
      padding: 12px 8px;
    }
    .total-hours {
      font-size: 0.85rem;
      color: #1677ff;
      font-weight: 600;
      margin: 4px 0;
      text-align: right;
    }
    .duplicate-warning {
      color: #ff4d4f;
      font-size: 0.8rem;
      margin-top: 6px;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .duplicate-warning.active {
      display: flex;
    }
    hr {
      border: none;
      border-top: 1px solid #eef2f6;
      margin: 14px 0;
    }
    .section-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #333;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }
    .button-row button {
      flex: 1 1 auto;
    }
    @media (max-width: 380px) {
      body { padding: 10px; }
      .card { padding: 16px; }
      button { padding: 12px 16px; font-size: 0.9rem; }
      .auto-add-row input { width: 60px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🏸 Badminton Slot Booking</h1>
  <p class="subtitle">Create your booking and copy the announcement</p>

  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>📆 Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label>Day (auto)</label>
        <input type="text" id="dayInput" placeholder="Auto-filled" readonly>
      </div>
      <div class="form-group">
        <label>⏰ Start Time</label>
        <input type="time" id="startTime" value="21:30">
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="time" id="endTime" value="23:30">
      </div>
      <div class="form-group full total-hours" id="totalHoursDisplay" style="grid-column: span 2;">
        <span id="totalHours">2.0 hours</span>
      </div>
      <div class="form-group full">
        <label>🏟️ Venue</label>
        <input type="text" id="venue" value="Forum Sba, Setia Alam" placeholder="Venue name & location">
      </div>
      <div class="form-group full">
        <label>Court Details</label>
        <input type="text" id="court" value="Rubber Court 6 & 7" placeholder="e.g. Rubber Court 6 & 7">
      </div>
      <div class="form-group">
        <label>💵 Price (RM)</label>
        <input type="number" id="price" value="17" step="0.5" min="0">
      </div>
      <div class="form-group">
        <label>🏸 Shuttle</label>
        <input type="text" id="shuttle" value="RSL" placeholder="e.g. RSL, Yonex">
      </div>
      <div class="form-group full">
        <label>👤 Host</label>
        <input type="text" id="host" value="" placeholder="Host name">
      </div>
    </div>

    <div class="players-section">
      <div class="section-title">👥 Players (tap ✅ = paid)</div>
      <div id="playersContainer"></div>
      <div class="duplicate-warning" id="duplicateWarning">⚠️ Duplicate name detected!</div>

      <div class="button-row">
        <button class="secondary" id="addPlayerBtn">+ Add Slot</button>
        <div class="auto-add-row">
          <input type="number" id="autoAddCount" placeholder="6" min="1" value="6">
          <button id="autoAddBtn" class="secondary" style="flex:1;">Auto Add</button>
        </div>
      </div>
      <div class="button-row">
        <button id="clearPlayersBtn" class="warning">🗑️ Clear Players</button>
        <button id="resetSessionBtn" class="danger">🔄 Reset</button>
      </div>
    </div>

    <div class="actions">
      <button id="copyBtn" class="secondary">📋 Copy</button>
      <button id="saveBookingBtn">💾 Save</button>
    </div>

    <div>
      <div class="section-title">📄 Preview</div>
      <div class="preview-box" id="preview"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; font-size:1rem;">📂 Saved Bookings</h3>
    <div id="savedBookingsList"></div>
    <p id="noBookingsMsg" style="color:#777; font-size:0.85rem;">No saved bookings yet.</p>
    <button id="clearAllBtn" class="danger" style="margin-top:12px; width:100%;">🗑️ Clear All Saved</button>
  </div>
</div>

<script>
  (function() {
    // ---------- DOM ----------
    const dateInput = document.getElementById('dateInput');
    const dayInput = document.getElementById('dayInput');
    const startTime = document.getElementById('startTime');
    const endTime = document.getElementById('endTime');
    const totalHoursSpan = document.getElementById('totalHours');
    const venue = document.getElementById('venue');
    const court = document.getElementById('court');
    const price = document.getElementById('price');
    const shuttle = document.getElementById('shuttle');
    const host = document.getElementById('host');
    const playersContainer = document.getElementById('playersContainer');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const autoAddCount = document.getElementById('autoAddCount');
    const autoAddBtn = document.getElementById('autoAddBtn');
    const clearPlayersBtn = document.getElementById('clearPlayersBtn');
    const resetSessionBtn = document.getElementById('resetSessionBtn');
    const duplicateWarning = document.getElementById('duplicateWarning');
    const previewDiv = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const saveBookingBtn = document.getElementById('saveBookingBtn');
    const savedBookingsList = document.getElementById('savedBookingsList');
    const noBookingsMsg = document.getElementById('noBookingsMsg');
    const clearAllBtn = document.getElementById('clearAllBtn');

    let players = [];

    // ---------- Helpers ----------
    function format12Hour(time24) {
      if (!time24) return "";
      const [h, m] = time24.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return "";
      const ampm = h >= 12 ? 'PM' : 'AM';
      let hour12 = h % 12;
      if (hour12 === 0) hour12 = 12;
      return `${hour12}:${m.toString().padStart(2, '0')} ${ampm}`;
    }

    function formatDateDMY(dateStr) {
      if (!dateStr) return "";
      const [year, month, day] = dateStr.split('-');
      return `${parseInt(day)}/${parseInt(month)}/${year}`;
    }

    function getDayFromDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T00:00:00");
      const days = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
      return days[d.getDay()];
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---------- Total hours (fixed) ----------
    function updateTotalHours() {
      const start = startTime.value;
      const end = endTime.value;
      if (!start || !end) {
        totalHoursSpan.textContent = '—';
        return;
      }
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const startMin = sh * 60 + sm;
      const endMin = eh * 60 + em;
      if (endMin <= startMin) {
        totalHoursSpan.textContent = 'Invalid time range';
        return;
      }
      const diffMin = endMin - startMin;
      const hours = diffMin / 60;
      totalHoursSpan.textContent = (hours % 1 === 0) ? `${hours} hour(s)` : `${hours.toFixed(1)} hours`;
    }

    // ---------- Init date ----------
    const today = new Date().toISOString().slice(0,10);
    dateInput.value = today;
    dayInput.value = getDayFromDate(today);
    dateInput.addEventListener('change', () => {
      dayInput.value = getDayFromDate(dateInput.value);
    });

    // Attach time listeners immediately
    startTime.addEventListener('input', () => { updateTotalHours(); updatePreview(); });
    endTime.addEventListener('input', () => { updateTotalHours(); updatePreview(); });
    // Force first calculation
    updateTotalHours();

    // Load remembered auto-add count
    const savedAutoCount = localStorage.getItem('autoAddCount');
    if (savedAutoCount) autoAddCount.value = savedAutoCount;

    // ---------- Players ----------
    function findDuplicates() {
      const names = players.map(p => p.name.trim().toLowerCase()).filter(n => n !== '');
      const duplicates = new Set();
      const seen = new Set();
      names.forEach(name => {
        if (seen.has(name)) duplicates.add(name);
        else seen.add(name);
      });
      return duplicates;
    }

    function renderPlayers() {
      playersContainer.innerHTML = '';
      const duplicates = findDuplicates();
      let hasDup = false;

      players.forEach((player, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        const nameLower = player.name.trim().toLowerCase();
        const isDuplicate = nameLower !== '' && duplicates.has(nameLower);
        if (isDuplicate) {
          row.classList.add('duplicate');
          hasDup = true;
        }
        row.innerHTML = `
          <span class="num">${idx + 1}.</span>
          <input type="text" class="player-name" value="${escapeHtml(player.name)}" placeholder="Name" data-index="${idx}">
          <button class="paid-btn ${player.paid ? 'paid' : ''}" data-index="${idx}">✅</button>
          <button class="remove-btn" data-index="${idx}">✕</button>
        `;
        playersContainer.appendChild(row);
      });

      duplicateWarning.classList.toggle('active', hasDup);

      document.querySelectorAll('.player-name').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = e.target.dataset.index;
          players[idx].name = e.target.value;
          renderPlayers();
          updatePreview();
        });
      });

      document.querySelectorAll('.paid-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          players[idx].paid = !players[idx].paid;
          renderPlayers();
          updatePreview();
        });
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index);
          players.splice(idx, 1);
          renderPlayers();
          updatePreview();
        });
      });
    }

    addPlayerBtn.addEventListener('click', () => {
      players.push({ name: "", paid: false });
      renderPlayers();
      updatePreview();
    });

    autoAddBtn.addEventListener('click', () => {
      let count = parseInt(autoAddCount.value);
      if (isNaN(count) || count < 1) {
        alert("Please enter a valid number (e.g., 6).");
        return;
      }
      if (count > 100) {
        alert("Maximum 100 slots.");
        count = 100;
      }
      localStorage.setItem('autoAddCount', count);
      for (let i = 0; i < count; i++) {
        players.push({ name: "", paid: false });
      }
      renderPlayers();
      updatePreview();
      autoAddCount.value = '';
    });

    clearPlayersBtn.addEventListener('click', () => {
      if (players.length === 0) return;
      if (confirm('Remove all players?')) {
        players = [];
        renderPlayers();
        updatePreview();
      }
    });

    resetSessionBtn.addEventListener('click', () => {
      if (confirm('Reset session? Venue will be kept.')) {
        const today = new Date().toISOString().slice(0,10);
        dateInput.value = today;
        dayInput.value = getDayFromDate(today);
        startTime.value = "21:30";
        endTime.value = "23:30";
        updateTotalHours();
        court.value = "";
        price.value = "";
        shuttle.value = "";
        host.value = "";
        players = [];
        renderPlayers();
        updatePreview();
      }
    });

    // ---------- Preview ----------
    function buildPreviewText() {
      const dateVal = formatDateDMY(dateInput.value) || ".........";
      const dayVal = dayInput.value || ".......";
      const start = format12Hour(startTime.value) || ".....";
      const end = format12Hour(endTime.value) || ".....";
      const venueVal = venue.value || "................";
      const courtVal = court.value || "................";
      const priceVal = price.value || "0";
      const shuttleVal = shuttle.value || "......";
      const hostVal = host.value.trim() || "......";

      const totalText = totalHoursSpan.textContent;
      const validTotal = (totalText !== '—' && totalText !== 'Invalid time range');
      const totalLine = validTotal ? `⏱️ Total: ${totalText}\n` : '';

      let text = `📆 : ${dateVal} , ${dayVal}\n`;
      text += `⏰ : ${start} - ${end}\n`;
      text += totalLine;
      text += `🏟️ : ${venueVal}\n`;
      text += `        (${courtVal})\n`;
      text += `💵 : RM${priceVal} Per player\n\n`;
      text += `🏸: Shuttle: ${shuttleVal}\n\n`;
      text += `Done payment sila tick ✅ ‼️\n\n`;
      text += `Host ${hostVal}\n\n`;

      players.forEach((p, i) => {
        const num = i + 1;
        const name = p.name.trim() || "(Open)";
        const paidMark = p.paid ? "✅️" : "";
        text += `${num}. ${name}${paidMark}\n`;
      });

      return text;
    }

    function updatePreview() {
      previewDiv.innerHTML = `<pre>${buildPreviewText()}</pre>`;
    }

    copyBtn.addEventListener('click', async () => {
      const text = buildPreviewText();
      try {
        await navigator.clipboard.writeText(text);
        alert("✅ Text copied!");
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert("✅ Text copied!");
      }
    });

    // ---------- Save / Load ----------
    const STORAGE_KEY = 'badminton_bookings';

    function getSavedBookings() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveBookingsToStorage(bookings) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
    }

    function addBookingToStorage(bookingData) {
      const bookings = getSavedBookings();
      bookings.push(bookingData);
      saveBookingsToStorage(bookings);
      renderSavedBookings();
    }

    function deleteBooking(index) {
      const bookings = getSavedBookings();
      bookings.splice(index, 1);
      saveBookingsToStorage(bookings);
      renderSavedBookings();
    }

    function renderSavedBookings() {
      const bookings = getSavedBookings();
      savedBookingsList.innerHTML = "";
      if (bookings.length === 0) {
        noBookingsMsg.classList.remove('hidden');
        return;
      }
      noBookingsMsg.classList.add('hidden');
      bookings.forEach((b, idx) => {
        const div = document.createElement('div');
        div.className = 'booking-list-item';
        const shortPreview = b.text.split('\n').slice(0, 4).join(' | ');
        div.innerHTML = `
          <div class="info">
            <strong>📅 ${b.date || '...'} ${b.day || ''}</strong><br>
            <small>${escapeHtml(shortPreview)} ...</small>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="secondary load-booking" data-index="${idx}" style="padding:8px 12px;">Load</button>
            <button class="danger delete-booking" data-index="${idx}" style="padding:8px 12px;">Del</button>
          </div>
        `;
        savedBookingsList.appendChild(div);
      });

      document.querySelectorAll('.load-booking').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          const bookings = getSavedBookings();
          const booking = bookings[idx];
          if (booking) loadBooking(booking);
        });
      });
      document.querySelectorAll('.delete-booking').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          if (confirm('Delete this booking?')) deleteBooking(idx);
        });
      });
    }

    function loadBooking(booking) {
      dateInput.value = booking.date || '';
      dayInput.value = booking.day || '';
      startTime.value = booking.start || '';
      endTime.value = booking.end || '';
      updateTotalHours();
      venue.value = booking.venue || '';
      court.value = booking.court || '';
      price.value = booking.price || '';
      shuttle.value = booking.shuttle || '';
      host.value = booking.host || '';
      players = booking.players ? JSON.parse(JSON.stringify(booking.players)) : [];
      renderPlayers();
      updatePreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    saveBookingBtn.addEventListener('click', () => {
      const bookingData = {
        date: dateInput.value,
        day: dayInput.value,
        start: startTime.value,
        end: endTime.value,
        venue: venue.value,
        court: court.value,
        price: price.value,
        shuttle: shuttle.value,
        host: host.value,
        players: JSON.parse(JSON.stringify(players)),
        text: buildPreviewText(),
        savedAt: new Date().toISOString()
      };
      addBookingToStorage(bookingData);
      alert("💾 Booking saved to browser!");
    });

    clearAllBtn.addEventListener('click', () => {
      if (confirm('Delete ALL saved bookings?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderSavedBookings();
      }
    });

    // ---------- Final init ----------
    renderPlayers();
    updatePreview();
    renderSavedBookings();
  })();
</script>
</body>
</html>
