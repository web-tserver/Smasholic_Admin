<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smasholic · Booking App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1; --primary-light: #e0e7ff;
      --bg: #f8fafc; --surface: #ffffff;
      --text-main: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --input-bg: #f1f5f9;
      --danger: #ef4444; --success: #10b981;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 8px 24px rgba(15,23,42,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',system-ui,sans-serif; }
    body {
      background:var(--bg); color:var(--text-main);
      display:flex; justify-content:center; min-height:100vh;
      overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
      -webkit-tap-highlight-color:transparent;
    }
    .app-container { width:100%; max-width:480px; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; position:relative; padding-bottom:80px; }
    .header {
      position:sticky; top:0; z-index:50;
      background:rgba(255,255,255,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      padding:10px 16px; border-bottom:1px solid rgba(226,232,240,0.6);
      display:flex; justify-content:center; align-items:center;
    }
    .header h1 { font-size:1.1rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:6px; letter-spacing:-0.5px; }
    .header .icon { font-size:1.25rem; }
    .content { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
    .card { background:var(--surface); border-radius:20px; padding:20px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .card-title { font-size:1rem; font-weight:600; display:flex; align-items:center; gap:8px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
    .full-width { grid-column:span 2; }
    .input-group { display:flex; flex-direction:column; gap:6px; }
    .input-group label { font-size:0.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
    input, textarea {
      width:100%; background:var(--input-bg); border:2px solid transparent; border-radius:12px;
      padding:12px 16px; font-size:0.95rem; color:var(--text-main); transition:all 0.2s ease; outline:none;
    }
    input:focus, textarea:focus { background:var(--surface); border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-light); }
    .readonly-badge {
      background:var(--primary-light); color:var(--primary); padding:12px 16px;
      border-radius:12px; font-weight:600; font-size:0.95rem; display:flex; align-items:center; justify-content:center;
    }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      background:var(--primary); color:white; border:none; padding:14px 20px;
      border-radius:14px; font-weight:600; font-size:0.95rem; cursor:pointer;
      transition:transform 0.1s ease, background 0.2s ease; width:100%;
    }
    .btn:active { transform:scale(0.97); }
    .btn-secondary { background:var(--input-bg); color:var(--text-main); }
    .btn-danger { background:#fee2e2; color:var(--danger); }
    .btn-danger:active { background:#fecaca; }
    .btn-outline { background:transparent; border:2px dashed var(--border); color:var(--text-muted); }
    .player-list { display:flex; flex-direction:column; gap:10px; }
    .player-row {
      display:flex; align-items:center; gap:10px; background:var(--surface);
      border:1px solid var(--border); padding:8px 10px; border-radius:16px; transition:all 0.2s; position:relative;
    }
    .player-row.focused { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
    .player-row.duplicate { border-color:#fca5a5; background:#fef2f2; }
    .player-avatar { width:32px; height:32px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.85rem; flex-shrink:0; }
    .player-row input { flex:1; padding:6px 0; background:transparent; border:none; box-shadow:none; font-size:0.95rem; }
    .action-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; flex-shrink:0; transition:0.2s; font-size:1.1rem; }
    .paid-toggle { background:var(--input-bg); color:var(--text-muted); }
    .paid-toggle.active { background:var(--success); color:white; }
    .remove-toggle { background:transparent; color:#cbd5e1; }
    .remove-toggle:hover { color:var(--danger); background:#fee2e2; }
    .duplicate-warning { color:var(--danger); font-size:0.8rem; font-weight:500; display:none; margin-top:10px; }
    .duplicate-warning.active { display:block; }
    .stepper-container { display:flex; flex-direction:column; align-items:center; margin-top:16px; }
    .stepper { display:flex; align-items:center; justify-content:center; gap:16px; background:var(--input-bg); padding:6px; border-radius:14px; width:fit-content; }
    .stepper-btn { width:36px; height:36px; border-radius:10px; background:var(--surface); border:none; box-shadow:var(--shadow-sm); font-size:1.2rem; color:var(--text-main); cursor:pointer; }
    .stepper-btn:active { transform:scale(0.9); }
    .stepper-count { font-weight:700; font-size:1.1rem; min-width:24px; text-align:center; color:var(--primary); text-decoration:underline; text-underline-offset:4px; cursor:pointer; }
    .stepper-hint { font-size:0.7rem; color:var(--text-muted); margin-top:6px; }
    .collapsible-header { cursor:pointer; }
    .collapsible-header .chevron { transition:transform 0.3s ease; color:var(--text-muted); }
    .collapsed .collapsible-header .chevron { transform:rotate(-90deg); }
    .collapsible-body { transition:max-height 0.3s ease, opacity 0.3s ease; overflow:hidden; opacity:1; }
    .collapsed .collapsible-body { max-height:0 !important; opacity:0; margin-top:0; }
    .preview-box { background:#1e293b; color:#f8fafc; border-radius:16px; padding:16px; font-family:monospace; font-size:0.85rem; white-space:pre-wrap; line-height:1.6; max-height:300px; overflow-y:auto; }
    .action-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.9);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(226,232,240,0.6);
      display:flex; justify-content:space-around; padding:12px 0 calc(12px + env(safe-area-inset-bottom));
      z-index:50; max-width:480px; margin:0 auto;
    }
    .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted); font-size:0.75rem; font-weight:500; cursor:pointer; transition:color 0.2s; }
    .nav-item.active { color:var(--primary); }
    .nav-icon { font-size:1.3rem; }
    .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:0.2s ease; padding:20px; }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal-content { background:var(--surface); border-radius:24px; padding:24px; width:100%; max-width:400px; transform:translateY(20px); transition:0.3s ease; box-shadow:var(--shadow-md); }
    .modal-overlay.active .modal-content { transform:translateY(0); }
    .toast { position:fixed; top:24px; left:50%; transform:translate(-50%,-20px); background:#1e293b; color:white; padding:12px 24px; border-radius:100px; font-size:0.9rem; font-weight:500; z-index:200; opacity:0; transition:0.3s cubic-bezier(0.4,0,0.2,1); pointer-events:none; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow-md); }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .saved-item { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .saved-info h4 { font-size:1rem; color:var(--primary); margin-bottom:4px; }
    .saved-info p { font-size:0.8rem; color:var(--text-muted); }
    .hidden { display:none !important; }
    .autocomplete-list { position:absolute; top:calc(100% + 4px); left:42px; right:42px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-md); z-index:50; max-height:150px; overflow-y:auto; display:none; }
    .autocomplete-list.active { display:block; }
    .autocomplete-item { padding:12px 16px; font-size:0.9rem; cursor:pointer; border-bottom:1px solid var(--input-bg); }
    .autocomplete-item:last-child { border-bottom:none; }
    .autocomplete-item:active { background:var(--input-bg); }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header"><h1><span class="icon">🏸</span> Smasholic</h1></div>
  <div class="content" id="mainContent">
    <div id="bookingTab">
      <div class="card">
        <div class="form-grid">
          <div class="input-group"><label>Date</label><input type="date" id="dateInput"></div>
          <div class="input-group"><label>Day</label><div class="readonly-badge" id="dayInput">AHAD</div></div>
          <div class="input-group"><label>Start</label><input type="time" id="startTime" value="21:30"></div>
          <div class="input-group"><label>End</label><input type="time" id="endTime" value="23:30"></div>
          <div class="input-group"><label>Duration</label><div class="readonly-badge" id="totalHours">2.0 Hrs</div></div>
          <div class="input-group"><label>Price (RM)</label><input type="number" id="price" value="17" step="0.5"></div>
          <div class="input-group full-width"><label>Venue</label><input type="text" id="venue" value="Forum Sba, Setia Alam"></div>
          <div class="input-group full-width"><label>Court</label><input type="text" id="court" value="Rubber Court 6 & 7"></div>
          <!-- New Location Link Field -->
          <div class="input-group full-width"><label>📍 Location Link</label><input type="url" id="locationLink" value="https://g.co/kgs/UMbmmAz" placeholder="Google Maps link"></div>
          <div class="input-group"><label>Shuttle</label><input type="text" id="shuttle" value="RSL"></div>
          <div class="input-group"><label>Host Name</label><input type="text" id="host" placeholder="Your name"></div>
        </div>
      </div>
      <div class="card collapsible" id="playersCard">
        <div class="card-header collapsible-header" onclick="toggleCollapse('playersCard')"><span class="card-title">👥 Roster</span><span class="chevron">▼</span></div>
        <div class="collapsible-body" style="max-height:2000px;">
          <div class="player-list" id="playersContainer"></div>
          <button class="btn btn-outline" id="addPlayerBtn" style="margin-top:12px;">+ Add Player</button>
          <div class="duplicate-warning" id="duplicateWarning">⚠️ Duplicate name detected!</div>
          <div class="stepper-container">
            <div class="stepper">
              <button class="stepper-btn" id="stepperMinus">–</button>
              <span class="stepper-count" id="playerCountDisplay" title="Tap to set total players">0</span>
              <button class="stepper-btn" id="stepperPlus">+</button>
            </div>
            <span class="stepper-hint">Tap number to instantly set total players</span>
          </div>
        </div>
      </div>
      <div class="card collapsible collapsed" id="waitingCard">
        <div class="card-header collapsible-header" onclick="toggleCollapse('waitingCard')"><span class="card-title">📋 Waiting List</span><span class="chevron">▼</span></div>
        <div class="collapsible-body" style="max-height:2000px;">
          <div class="player-list" id="waitingContainer"></div>
          <button class="btn btn-outline" id="addWaitingBtn">+ Add to Waiting List</button>
        </div>
      </div>
      <div class="card collapsible collapsed" id="footerCard">
        <div class="card-header collapsible-header" onclick="toggleCollapse('footerCard')"><span class="card-title">📌 Footer Message</span><span class="chevron">▼</span></div>
        <div class="collapsible-body" style="max-height:500px;">
          <textarea id="footerMessage" rows="4">📌 Sebarang pembayaran utk confirm slot last pada JUMAAT pagi boleh dibuat melalui QR sahaja. No cash on court please. Thank you ✨</textarea>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">📄 Preview</span></div>
        <div class="preview-box" id="preview"></div>
        <div class="action-row">
          <button class="btn" id="copyBtn" style="grid-column:span 2;">📋 Copy Announcement</button>
          <button class="btn btn-secondary" id="importBtn">📥 Import</button>
          <button class="btn btn-secondary" id="saveBookingBtn">💾 Save</button>
        </div>
        <button class="btn btn-danger" id="resetSessionBtn" style="margin-top:12px;">Reset All Fields</button>
      </div>
    </div>
    <div id="savedTab" class="hidden">
      <div class="card">
        <div class="card-header"><span class="card-title">📂 Saved Sessions</span></div>
        <div id="savedBookingsList"></div>
        <p id="noBookingsMsg" style="text-align:center;color:var(--text-muted);padding:20px 0;">No saved sessions yet.</p>
        <button class="btn btn-danger" id="clearAllBtn" style="margin-top:16px;">Clear All Saved</button>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="booking"><span class="nav-icon">📅</span><span>Booking</span></div>
    <div class="nav-item" data-tab="saved"><span class="nav-icon">📂</span><span>Saved</span></div>
  </nav>
</div>
<div id="toast" class="toast"></div>
<div class="modal-overlay" id="importModal">
  <div class="modal-content">
    <h3 style="margin-bottom:12px;font-weight:600;">Import Session</h3>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px;">Paste the exact copied announcement to reverse‑fill the form.</p>
    <textarea id="importTextarea" rows="10" placeholder="Paste announcement..."></textarea>
    <div class="action-row" style="margin-top:16px;">
      <button class="btn btn-secondary" id="importCancelBtn">Cancel</button>
      <button class="btn" id="importParseBtn">Parse & Fill</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="confirmModal">
  <div class="modal-content">
    <h3 id="confirmTitle" style="margin-bottom:12px;font-weight:600;">Confirm</h3>
    <p id="confirmMessage" style="font-size:0.9rem;color:var(--text-muted);margin-bottom:20px;"></p>
    <div class="action-row">
      <button class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
      <button class="btn btn-danger" id="confirmActionBtn">Yes, do it</button>
    </div>
  </div>
</div>
<script>
(function() {
  const els = {
    date: document.getElementById('dateInput'), day: document.getElementById('dayInput'),
    start: document.getElementById('startTime'), end: document.getElementById('endTime'), duration: document.getElementById('totalHours'),
    venue: document.getElementById('venue'), court: document.getElementById('court'),
    locationLink: document.getElementById('locationLink'), // new
    price: document.getElementById('price'), shuttle: document.getElementById('shuttle'),
    host: document.getElementById('host'), footer: document.getElementById('footerMessage'),
    preview: document.getElementById('preview'), playersContainer: document.getElementById('playersContainer'),
    waitingContainer: document.getElementById('waitingContainer'),
    playerCount: document.getElementById('playerCountDisplay'), dupWarning: document.getElementById('duplicateWarning'),
    addPlayer: document.getElementById('addPlayerBtn'), addWaiting: document.getElementById('addWaitingBtn'),
    stepMinus: document.getElementById('stepperMinus'), stepPlus: document.getElementById('stepperPlus'),
    copy: document.getElementById('copyBtn'), save: document.getElementById('saveBookingBtn'), importBtn: document.getElementById('importBtn'),
    reset: document.getElementById('resetSessionBtn'), clearSaved: document.getElementById('clearAllBtn'),
    toast: document.getElementById('toast'), importModal: document.getElementById('importModal'),
    confirmModal: document.getElementById('confirmModal')
  };

  let players = [];
  let waitingPlayers = [];
  let savedBookings = [];
  let confirmCallback = null;
  try { savedBookings = JSON.parse(localStorage.getItem('smasholic_saved_bookings') || '[]'); } catch(e) { savedBookings = []; }
  els.date.value = new Date().toISOString().split('T')[0];

  function showToast(msg, icon = '✅') {
    els.toast.innerHTML = `<span>${icon}</span> ${msg}`;
    els.toast.classList.add('show');
    setTimeout(() => els.toast.classList.remove('show'), 2500);
  }
  function vibrate(ms = 10) { if(navigator.vibrate) navigator.vibrate(ms); }
  function escapeHtml(str) { return (str||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  window.toggleCollapse = (id) => document.getElementById(id).classList.toggle('collapsed');
  function showConfirm(title, msg, onConfirm) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = msg;
    confirmCallback = onConfirm;
    els.confirmModal.classList.add('active');
  }
  document.getElementById('confirmCancelBtn').onclick = () => { els.confirmModal.classList.remove('active'); vibrate(); };
  document.getElementById('confirmActionBtn').onclick = () => { els.confirmModal.classList.remove('active'); vibrate(); if(confirmCallback) confirmCallback(); };

  document.querySelectorAll('.nav-item').forEach(nav => {
    nav.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      nav.classList.add('active');
      const isBooking = nav.dataset.tab === 'booking';
      document.getElementById('bookingTab').classList.toggle('hidden', !isBooking);
      document.getElementById('savedTab').classList.toggle('hidden', isBooking);
      if(!isBooking) renderSaved();
      vibrate();
    });
  });

  function calcDuration() {
    if(!els.start.value || !els.end.value) return 0;
    const [sh, sm] = els.start.value.split(':').map(Number);
    const [eh, em] = els.end.value.split(':').map(Number);
    let sMins = sh * 60 + sm, eMins = eh * 60 + em;
    if (eMins <= sMins) eMins += 24 * 60;
    return (eMins - sMins) / 60;
  }
  const malayDays = ["AHAD","ISNIN","SELASA","RABU","KHAMIS","JUMAAT","SABTU"];
  function updateDateData() {
    if(!els.date.value) return;
    const d = new Date(els.date.value + 'T00:00:00');
    els.day.textContent = malayDays[d.getDay()];
    const hrs = calcDuration();
    els.duration.textContent = (hrs % 1 === 0 ? hrs.toFixed(0) : hrs.toFixed(1)) + ' Hrs';
    updatePreview();
  }
  els.date.addEventListener('change', updateDateData);
  els.start.addEventListener('input', updateDateData);
  els.end.addEventListener('input', updateDateData);
  updateDateData();
  // Listen to all relevant fields including the new location link
  [els.venue, els.court, els.locationLink, els.price, els.shuttle, els.host, els.footer].forEach(e => e.addEventListener('input', updatePreview));

  const NAMES_KEY = 'smasholic_names';
  function getNames() { try { return JSON.parse(localStorage.getItem(NAMES_KEY)) || []; } catch { return []; } }
  function addName(name) {
    name = name.trim(); if(!name) return;
    let names = getNames().filter(n => n.toLowerCase() !== name.toLowerCase());
    names.unshift(name);
    if(names.length > 40) names.pop();
    localStorage.setItem(NAMES_KEY, JSON.stringify(names));
  }
  function showAutocomplete(input, idx, isWaiting = false) {
    document.querySelectorAll('.autocomplete-list').forEach(e => e.remove());
    const val = input.value.trim().toLowerCase();
    if(!val) return;
    const matches = getNames().filter(n => n.toLowerCase().includes(val) && n.toLowerCase() !== val);
    if(!matches.length) return;
    const list = document.createElement('div'); list.className = 'autocomplete-list active';
    matches.forEach(name => {
      const item = document.createElement('div'); item.className = 'autocomplete-item'; item.textContent = name;
      item.onmousedown = (e) => { e.preventDefault(); input.value = name; if(isWaiting) waitingPlayers[idx].name = name; else { players[idx].name = name; updateDuplicateStyling(); } list.remove(); updatePreview(); addName(name); vibrate(); };
      list.appendChild(item);
    });
    input.closest('.player-row').appendChild(list);
  }

  els.addPlayer.onclick = () => { players.push({name:"", paid:false}); renderPlayers(); updatePreview(); vibrate(); };
  els.stepPlus.onclick = () => { players.push({name:"", paid:false}); renderPlayers(); updatePreview(); vibrate(); };
  els.stepMinus.onclick = () => { if(players.length) { players.pop(); renderPlayers(); updatePreview(); vibrate(); } };
  els.playerCount.onclick = () => {
    const count = parseInt(prompt("Enter total number of players (e.g. 16):", players.length));
    if (!isNaN(count) && count >= 0 && count <= 100) {
      while(players.length < count) players.push({name:"", paid:false});
      while(players.length > count) players.pop();
      renderPlayers(); updatePreview(); vibrate();
    } else if (!isNaN(count) && (count < 0 || count > 100)) showToast("Enter a number between 0-100", "⚠️");
  };

  function findDuplicates() {
    const counts = new Map(), dups = new Set();
    players.forEach(p => { const n = p.name.trim().toLowerCase(); if(n) { counts.set(n, (counts.get(n)||0)+1); if(counts.get(n)>1) dups.add(n); }});
    return dups;
  }
  function updateDuplicateStyling() {
    const dups = findDuplicates();
    document.querySelectorAll('#playersContainer .player-row').forEach((row, idx) => {
      if(!players[idx]) return;
      row.classList.toggle('duplicate', dups.has(players[idx].name.trim().toLowerCase()));
    });
    els.dupWarning.classList.toggle('active', dups.size > 0);
  }

  let longPressTimer = null, isDragging = false, dragStartIdx = null, dragTargetIdx = null;
  function addDragListeners() {
    document.querySelectorAll('#playersContainer .player-row').forEach((playerRow) => {
      const idx = parseInt(playerRow.dataset.idx);
      playerRow.addEventListener('touchstart', (e) => {
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => { isDragging = true; dragStartIdx = idx; playerRow.style.opacity = '0.5'; vibrate(15); }, 400);
      }, { passive: true });
      playerRow.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
        if (isDragging) {
          isDragging = false; document.querySelectorAll('#playersContainer .player-row').forEach(r => { r.style.opacity = '1'; r.style.borderTop = ''; });
          if (dragStartIdx !== null && dragTargetIdx !== null && dragStartIdx !== dragTargetIdx) {
            const moved = players.splice(dragStartIdx, 1)[0]; players.splice(dragTargetIdx, 0, moved);
            renderPlayers(); updatePreview(); vibrate(20);
          }
          dragStartIdx = null; dragTargetIdx = null;
        }
      });
      playerRow.addEventListener('touchmove', (e) => {
        if (!isDragging) return; e.preventDefault();
        const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const row = target?.closest('#playersContainer .player-row');
        if (row && row !== playerRow) {
          dragTargetIdx = parseInt(row.dataset.idx);
          document.querySelectorAll('#playersContainer .player-row').forEach(r => r.style.borderTop = '');
          row.style.borderTop = '3px solid var(--primary)';
        }
      }, { passive: false });
    });
  }

  function renderPlayers() {
    els.playersContainer.innerHTML = '';
    players.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'player-row'; row.dataset.idx = idx;
      row.innerHTML = `
        <div class="player-avatar">${idx + 1}</div>
        <input type="text" class="pname" value="${escapeHtml(p.name)}" placeholder="Enter name..." data-idx="${idx}" autocomplete="off">
        <button class="action-icon paid-toggle ${p.paid ? 'active' : ''}" data-idx="${idx}">✅</button>
        <button class="action-icon remove-toggle" data-idx="${idx}">✕</button>
      `;
      els.playersContainer.appendChild(row);
    });
    document.querySelectorAll('#playersContainer .pname').forEach(inp => {
      inp.oninput = function() { players[this.dataset.idx].name = this.value; updateDuplicateStyling(); updatePreview(); showAutocomplete(this, this.dataset.idx); };
      inp.onfocus = function() { this.closest('.player-row').classList.add('focused'); if(this.value.trim()) showAutocomplete(this, this.dataset.idx); };
      inp.onblur = function() { this.closest('.player-row').classList.remove('focused'); setTimeout(() => { const l = this.parentNode.querySelector('.autocomplete-list'); if(l) l.remove(); }, 150); };
    });
    document.querySelectorAll('#playersContainer .paid-toggle').forEach(btn => btn.onclick = function() { vibrate(); const i = this.dataset.idx; players[i].paid = !players[i].paid; if(players[i].paid && players[i].name) addName(players[i].name); renderPlayers(); updatePreview(); });
    document.querySelectorAll('#playersContainer .remove-toggle').forEach(btn => btn.onclick = function() { vibrate(); players.splice(this.dataset.idx, 1); renderPlayers(); updatePreview(); });
    els.playerCount.textContent = players.length;
    updateDuplicateStyling(); addDragListeners();
  }

  els.addWaiting.onclick = () => { waitingPlayers.push({name:""}); renderWaitingPlayers(); updatePreview(); vibrate(); };
  function renderWaitingPlayers() {
    els.waitingContainer.innerHTML = '';
    waitingPlayers.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `
        <div class="player-avatar" style="background:var(--input-bg);color:var(--text-muted);">${idx + 1}</div>
        <input type="text" class="wname" value="${escapeHtml(p.name)}" placeholder="Waiting player..." data-idx="${idx}">
        <button class="action-icon remove-toggle w-remove" data-idx="${idx}">✕</button>
      `;
      els.waitingContainer.appendChild(row);
    });
    document.querySelectorAll('.wname').forEach(inp => {
      inp.oninput = function() { waitingPlayers[this.dataset.idx].name = this.value; updatePreview(); showAutocomplete(this, this.dataset.idx, true); };
      inp.onfocus = function() { this.closest('.player-row').classList.add('focused'); if(this.value.trim()) showAutocomplete(this, this.dataset.idx, true); };
      inp.onblur = function() { this.closest('.player-row').classList.remove('focused'); setTimeout(() => { const l = this.parentNode.querySelector('.autocomplete-list'); if(l) l.remove(); }, 150); };
    });
    document.querySelectorAll('.w-remove').forEach(btn => btn.onclick = function() { vibrate(); waitingPlayers.splice(this.dataset.idx, 1); renderWaitingPlayers(); updatePreview(); });
  }

  function formatTime12(t) {
    if(!t) return '';
    let [h,m] = t.split(':');
    h = parseInt(h);
    const ampm = h >= 12 ? 'pm' : 'am';
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return `${h12}.${m}${ampm}`;
  }
  function formatDateDMY(dStr) {
    if(!dStr) return '';
    const [y,m,d] = dStr.split('-');
    return `${parseInt(d)}/${parseInt(m)}/${y}`;
  }

  function buildPreview() {
    const dateVal = formatDateDMY(els.date.value);
    const dayVal = els.day.textContent;
    const start = formatTime12(els.start.value);
    const end = formatTime12(els.end.value);
    const durationHrs = calcDuration();
    const durationText = (durationHrs % 1 === 0 ? durationHrs.toFixed(0) : durationHrs.toFixed(1)) + ' hour(s)';
    const venueVal = els.venue.value;
    const courtVal = els.court.value;
    const locationVal = els.locationLink.value.trim(); // new
    const priceVal = parseFloat(els.price.value || 0).toFixed(2);
    const shuttleVal = els.shuttle.value;
    const hostVal = els.host.value.trim() || '......';

    let text = `📆 : ${dateVal} , ${dayVal}\n`;
    text += `⏰ : ${start} - ${end}\n`;
    text += `⏱️ Total: ${durationText}\n`;
    text += `🏟️ : ${venueVal}\n        (${courtVal})\n`;
    if (locationVal) text += `📍 : ${locationVal}\n`;  // location link
    text += `💵 : RM${priceVal} Per player\n\n`;
    text += `🏸: Shuttle: ${shuttleVal}\n\n`;
    text += `Done payment sila tick ✅ ‼️\n\n`;
    text += `Host ${hostVal}\n\n`;

    players.forEach((p, i) => {
      const name = p.name.trim() || '(Open)';
      text += `${i+1}. ${name}${p.paid ? '✅️' : ''}\n`;
    });

    if (waitingPlayers.length) {
      text += `\nWaiting List\n`;
      waitingPlayers.forEach((p, i) => text += `${i+1}. ${p.name.trim() || ''}\n`);
    }

    const footer = els.footer.value.trim();
    if (footer) text += `\n${footer}\n`;
    return text;
  }

  function updatePreview() { els.preview.textContent = buildPreview(); }

  // --- ROBUST COPY ---
  els.copy.onclick = async () => {
    vibrate();
    const announcement = buildPreview();
    try {
      await navigator.clipboard.writeText(announcement);
      showToast("Copied to clipboard!");
      return;
    } catch (e) {
      const textarea = document.createElement('textarea');
      textarea.value = announcement;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); showToast("Copied to clipboard!"); }
      catch (err) { showToast("Copy failed", "❌"); }
      document.body.removeChild(textarea);
    }
  };

  // --- REVERSE IMPORT (updated for location link) ---
  function parseTime12to24(str) {
    const match = str.match(/^(\d{1,2})\.(\d{2})(am|pm)$/i);
    if (!match) return null;
    let h = parseInt(match[1]), m = match[2], period = match[3].toLowerCase();
    if (period === 'pm' && h !== 12) h += 12;
    if (period === 'am' && h === 12) h = 0;
    return `${h.toString().padStart(2,'0')}:${m}`;
  }
  function parseDMYtoYMD(str) {
    const parts = str.split('/');
    if (parts.length !== 3) return null;
    return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
  }

  els.importBtn.onclick = () => { vibrate(); document.getElementById('importTextarea').value = ''; els.importModal.classList.add('active'); };
  document.getElementById('importCancelBtn').onclick = () => { vibrate(); els.importModal.classList.remove('active'); };
  document.getElementById('importParseBtn').onclick = () => {
    vibrate();
    const raw = document.getElementById('importTextarea').value.trim();
    if (!raw) { showToast('Paste announcement text first', '⚠️'); return; }

    try {
      const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');
      let parsedDate = '', parsedDay = '', parsedStart = '', parsedEnd = '',
          parsedVenue = '', parsedCourt = '', parsedLocation = '', parsedPrice = '', parsedShuttle = '', parsedHost = '';
      let newPlayers = [], newWaiting = [];
      let mode = 'head';
      let footerLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('📆')) {
          const m = line.match(/📆\s*:\s*([\d\/]+)\s*,\s*(\w+)/);
          if (m) {
            const ymd = parseDMYtoYMD(m[1].trim());
            if (ymd) parsedDate = ymd;
            parsedDay = m[2].trim();
          }
        } else if (line.startsWith('⏰')) {
          const m = line.match(/⏰\s*:\s*(.+?)\s*-\s*(.+)/);
          if (m) {
            const s24 = parseTime12to24(m[1].trim());
            const e24 = parseTime12to24(m[2].trim());
            if (s24) parsedStart = s24;
            if (e24) parsedEnd = e24;
          }
        } else if (line.startsWith('🏟️')) {
          const m = line.match(/🏟️\s*:\s*(.+)/);
          if (m) parsedVenue = m[1].trim();
          if (i+1 < lines.length && lines[i+1].startsWith('(') && lines[i+1].endsWith(')')) {
            const courtMatch = lines[i+1].match(/\((.+)\)/);
            if (courtMatch) parsedCourt = courtMatch[1].trim();
            i++;
          }
        } else if (line.startsWith('📍')) {   // parse location link
          const m = line.match(/📍\s*:\s*(.+)/);
          if (m) parsedLocation = m[1].trim();
        } else if (line.startsWith('💵')) {
          const m = line.match(/RM\s*([\d.]+)/);
          if (m) parsedPrice = m[1];
        } else if (line.startsWith('🏸')) {
          const m = line.match(/Shuttle:\s*(.+)/);
          if (m) parsedShuttle = m[1].trim();
        } else if (line.startsWith('Host ')) {
          const m = line.match(/^Host\s+(.+)/);
          if (m) parsedHost = m[1].trim();
          mode = 'players';
        } else if (mode === 'players' && /^\d+\./.test(line)) {
          const m = line.match(/^(\d+)\.\s*(.+)$/);
          if (m) {
            let name = m[2].trim();
            let paid = false;
            if (name.endsWith('✅️') || name.endsWith('✅')) {
              paid = true;
              name = name.slice(0, - (name.endsWith('✅️') ? 2 : 1)).trim();
            }
            if (name === '(Open)' || name === '...') name = '';
            newPlayers.push({ name, paid });
          }
        } else if (line === 'Waiting List') {
          mode = 'waiting';
        } else if (mode === 'waiting' && /^\d+\./.test(line)) {
          const m = line.match(/^(\d+)\.\s*(.+)$/);
          if (m) {
            let name = m[2].trim();
            if (name === '...') name = '';
            newWaiting.push({ name });
          }
        } else if (mode === 'players' || mode === 'waiting') {
          if (!/^\d+\./.test(line) && line !== '') {
            mode = 'footer';
            footerLines.push(line);
          }
        } else if (mode === 'footer') {
          footerLines.push(line);
        }
      }

      if (parsedDate) els.date.value = parsedDate;
      if (parsedStart) els.start.value = parsedStart;
      if (parsedEnd) els.end.value = parsedEnd;
      if (parsedVenue) els.venue.value = parsedVenue;
      if (parsedCourt) els.court.value = parsedCourt;
      if (parsedLocation) els.locationLink.value = parsedLocation;
      else els.locationLink.value = 'https://g.co/kgs/UMbmmAz'; // default if missing
      if (parsedPrice) els.price.value = parsedPrice;
      if (parsedShuttle) els.shuttle.value = parsedShuttle;
      if (parsedHost) els.host.value = parsedHost;

      players = newPlayers;
      waitingPlayers = newWaiting;
      if (footerLines.length) els.footer.value = footerLines.join('\n');
      else els.footer.value = '📌 Sebarang pembayaran utk confirm slot last pada JUMAAT pagi boleh dibuat melalui QR sahaja. No cash on court please. Thank you ✨';

      updateDateData();
      renderPlayers();
      renderWaitingPlayers();
      updatePreview();
      els.importModal.classList.remove('active');
      showToast('Imported successfully!');
    } catch (e) {
      showToast('Import failed – check format', '❌');
    }
  };

  // Save/Load (location included)
  els.save.onclick = () => { vibrate();
    savedBookings.unshift({
      id: Date.now(), date: els.date.value, day: els.day.textContent, start: els.start.value, end: els.end.value,
      venue: els.venue.value, court: els.court.value, location: els.locationLink.value, // save location
      price: els.price.value, shuttle: els.shuttle.value, host: els.host.value, footer: els.footer.value,
      players: JSON.parse(JSON.stringify(players)), waiting: JSON.parse(JSON.stringify(waitingPlayers))
    });
    localStorage.setItem('smasholic_saved_bookings', JSON.stringify(savedBookings));
    showToast("Session Saved!", "💾");
  };
  function renderSaved() {
    const list = document.getElementById('savedBookingsList');
    list.innerHTML = '';
    document.getElementById('noBookingsMsg').style.display = savedBookings.length ? 'none' : 'block';
    savedBookings.forEach((b, idx) => {
      const item = document.createElement('div'); item.className = 'saved-item';
      item.innerHTML = `<div class="saved-info"><h4>${b.day}, ${formatDateDMY(b.date)}</h4><p>${b.venue} • ${b.players.length} Players</p></div>
        <div style="display:flex;gap:8px;"><button class="btn btn-secondary load-btn" data-idx="${idx}" style="padding:8px 12px;">Load</button><button class="btn btn-danger del-btn" data-idx="${idx}" style="padding:8px 12px;">✕</button></div>`;
      list.appendChild(item);
    });
    document.querySelectorAll('.load-btn').forEach(b => b.onclick = function() { vibrate(); const d = savedBookings[this.dataset.idx]; els.date.value = d.date; els.start.value = d.start; els.end.value = d.end; els.venue.value = d.venue; els.court.value = d.court; els.locationLink.value = d.location || 'https://g.co/kgs/UMbmmAz'; els.price.value = d.price; els.shuttle.value = d.shuttle; els.host.value = d.host; els.footer.value = d.footer; players = JSON.parse(JSON.stringify(d.players)); waitingPlayers = JSON.parse(JSON.stringify(d.waiting)); updateDateData(); renderPlayers(); renderWaitingPlayers(); document.querySelector('.nav-item[data-tab="booking"]').click(); showToast("Loaded!"); });
    document.querySelectorAll('.del-btn').forEach(b => b.onclick = function() { vibrate(); const idx = this.dataset.idx; showConfirm('Delete Session', 'Remove this saved booking permanently?', () => { savedBookings.splice(idx, 1); localStorage.setItem('smasholic_saved_bookings', JSON.stringify(savedBookings)); renderSaved(); }); });
  }
  els.clearSaved.onclick = () => { if(savedBookings.length) showConfirm('Clear All', 'Delete all saved sessions?', () => { savedBookings = []; localStorage.removeItem('smasholic_saved_bookings'); renderSaved(); }); };
  els.reset.onclick = () => showConfirm('Reset Form', 'Clear all fields and players?', () => { els.date.value = new Date().toISOString().split('T')[0]; els.start.value = "21:30"; els.end.value = "23:30"; els.venue.value = "Forum Sba, Setia Alam"; els.court.value = "Rubber Court 6 & 7"; els.locationLink.value = "https://g.co/kgs/UMbmmAz"; els.price.value = "17"; els.shuttle.value = "RSL"; els.host.value = ""; players = []; waitingPlayers = []; updateDateData(); renderPlayers(); renderWaitingPlayers(); showToast('Reset complete!'); });

  renderPlayers(); renderWaitingPlayers(); updatePreview();
})();
</script>
</body>
</html>
