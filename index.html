<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🏸 Badminton Slot Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',system-ui,sans-serif; }
    body { background:#f5f7fa; min-height:100vh; padding:12px; display:flex; justify-content:center; align-items:flex-start; }
    .container { max-width:480px; width:100%; }
    h1 { text-align:center; font-weight:600; font-size:1.4rem; color:#1a1a1a; margin-bottom:2px; }
    .subtitle { text-align:center; color:#6b7280; margin-bottom:18px; font-size:0.8rem; }
    .card { background:#fff; border-radius:18px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,0.03); margin-bottom:14px; border:1px solid #f0f2f5; }
    .form-grid { display:flex; flex-direction:column; gap:14px; }
    .form-group { display:flex; flex-direction:column; }
    label { font-weight:500; font-size:0.75rem; margin-bottom:4px; color:#4b5563; }
    input, select, textarea { padding:12px 14px; border:1px solid #e5e7eb; border-radius:12px; font-size:0.95rem; background:#fff; color:#111827; outline:none; transition:border-color 0.15s, box-shadow 0.15s; -webkit-appearance:none; }
    input:focus, textarea:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
    textarea { resize:vertical; min-height:100px; font-family:monospace; font-size:0.85rem; }
    button { background:#111827; color:white; border:none; padding:12px 18px; border-radius:12px; font-weight:500; font-size:0.9rem; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:0.15s; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
    button:active { transform:scale(0.97); }
    button.secondary { background:#f9fafb; color:#111827; border:1px solid #e5e7eb; }
    button.danger { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    button.warning { background:#fffbeb; color:#d97706; border:1px solid #fde68a; }
    .players-section { margin:18px 0 8px; }
    .player-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; background:#fff; padding:10px 12px; border-radius:14px; border:1px solid #f0f2f5; }
    .player-row .num { font-weight:600; width:20px; color:#6366f1; flex-shrink:0; font-size:0.9rem; }
    .player-row input { flex:1; border:1px solid transparent; padding:8px 8px; border-radius:10px; background:transparent; font-size:0.9rem; }
    .player-row input:focus { border-color:#6366f1; background:#fff; }
    .player-row .paid-btn { background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; padding:6px 12px; font-weight:600; font-size:0.85rem; color:#9ca3af; min-width:40px; flex-shrink:0; cursor:pointer; }
    .player-row .paid-btn.paid { background:#ecfdf5; border-color:#6ee7b7; color:#059669; }
    .player-row .remove-btn { background:none; border:none; color:#d1d5db; font-size:1.1rem; cursor:pointer; padding:4px 6px; border-radius:8px; flex-shrink:0; }
    .player-row .remove-btn:hover { background:#fef2f2; color:#dc2626; }
    .player-row.duplicate input { border-color:#fecaca; background:#fef2f2; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px; }
    .actions button { flex:1 1 auto; }
    .preview-box { background:#f9fafb; border-radius:16px; padding:14px; border:1px solid #f0f2f5; margin-top:10px; font-family:monospace; font-size:0.8rem; white-space:pre-wrap; overflow-x:auto; color:#1f2937; line-height:1.5; }
    .booking-list-item { background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; border:1px solid #f0f2f5; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .hidden { display:none !important; }
    .auto-add-row { display:flex; align-items:center; gap:8px; flex:1; }
    .auto-add-row input { width:65px; text-align:center; }
    .total-hours { font-size:0.8rem; color:#6366f1; font-weight:500; margin:4px 0; display:flex; align-items:center; gap:4px; text-align:left; justify-content:flex-start; }
    .duplicate-warning { color:#dc2626; font-size:0.75rem; display:none; align-items:center; gap:4px; margin-top:6px; }
    .duplicate-warning.active { display:flex; }
    .section-title { font-weight:600; font-size:0.85rem; margin-bottom:6px; color:#111827; }
    .import-modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
    .import-modal .modal-content { background:#fff; border-radius:20px; padding:18px; width:100%; max-width:460px; max-height:80vh; overflow-y:auto; }
  </style>
</head>
<body>
<div class="container">
  <h1>🏸 Badminton Slot Booking</h1>
  <p class="subtitle">Minimal · Fast · Offline</p>

  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>📆 Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label>Day (auto)</label>
        <input type="text" id="dayInput" readonly>
      </div>
      <div class="form-group">
        <label>⏰ Start</label>
        <input type="time" id="startTime" value="21:30">
      </div>
      <div class="form-group">
        <label>End</label>
        <input type="time" id="endTime" value="23:30">
      </div>
      <div class="form-group">
        <label>⏱️ Total</label>
        <div class="total-hours"><span id="totalHours">2.0 hours</span></div>
      </div>
      <div class="form-group">
        <label>🏟️ Venue</label>
        <input type="text" id="venue" value="Forum Sba, Setia Alam">
      </div>
      <div class="form-group">
        <label>Court Details</label>
        <input type="text" id="court" value="Rubber Court 6 & 7">
      </div>
      <div class="form-group">
        <label>💵 Price (RM)</label>
        <input type="number" id="price" value="17" step="0.5">
      </div>
      <div class="form-group">
        <label>🏸 Shuttle</label>
        <input type="text" id="shuttle" value="RSL">
      </div>
      <div class="form-group">
        <label>👤 Host</label>
        <input type="text" id="host" placeholder="Host name">
      </div>
    </div>

    <div class="players-section">
      <div class="section-title">👥 Players · tap ✅ to mark paid</div>
      <div id="playersContainer"></div>
      <div class="duplicate-warning" id="duplicateWarning">⚠️ Duplicate name detected</div>

      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">
        <button class="secondary" id="addPlayerBtn" style="flex:1;">+ Add Slot</button>
        <div class="auto-add-row" style="flex:1;">
          <input type="number" id="autoAddCount" placeholder="6" min="1" value="6">
          <button id="autoAddBtn" class="secondary" style="flex:1;">Auto Add</button>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button id="clearPlayersBtn" class="warning" style="flex:1;">Clear Players</button>
        <button id="resetSessionBtn" class="danger" style="flex:1;">Reset Session</button>
      </div>
    </div>

    <div class="actions">
      <button id="copyBtn" class="secondary" style="flex:1;">📋 Copy</button>
      <button id="saveBookingBtn" style="flex:1;">💾 Save</button>
      <button id="importBtn" class="secondary" style="flex:1;">📥 Import</button>
    </div>

    <div>
      <div class="section-title">📄 Announcement Preview</div>
      <div class="preview-box" id="preview"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:0.95rem; font-weight:600; margin-bottom:10px;">📂 Saved Bookings</h3>
    <div id="savedBookingsList"></div>
    <p id="noBookingsMsg" style="color:#9ca3af; font-size:0.8rem; text-align:center; padding:12px;">No saved bookings yet.</p>
    <button id="clearAllBtn" class="danger" style="width:100%; margin-top:10px;">Clear All Saved</button>
  </div>
</div>

<!-- Import Modal -->
<div id="importModal" class="import-modal hidden">
  <div class="modal-content">
    <h3 style="margin-bottom:10px; font-size:1rem;">📥 Paste Announcement</h3>
    <textarea id="importTextarea" placeholder="Paste the full announcement here..."></textarea>
    <div style="display:flex; gap:8px; margin-top:12px; justify-content:flex-end;">
      <button id="importCancelBtn" class="secondary">Cancel</button>
      <button id="importParseBtn">Parse & Fill</button>
    </div>
    <p id="importError" style="color:#dc2626; font-size:0.8rem; margin-top:8px; display:none;"></p>
  </div>
</div>

<script>
  (function() {
    const dateInput = document.getElementById('dateInput');
    const dayInput = document.getElementById('dayInput');
    const startTime = document.getElementById('startTime');
    const endTime = document.getElementById('endTime');
    const totalHoursSpan = document.getElementById('totalHours');
    const venue = document.getElementById('venue');
    const court = document.getElementById('court');
    const price = document.getElementById('price');
    const shuttle = document.getElementById('shuttle');
    const host = document.getElementById('host');
    const playersContainer = document.getElementById('playersContainer');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const autoAddCount = document.getElementById('autoAddCount');
    const autoAddBtn = document.getElementById('autoAddBtn');
    const clearPlayersBtn = document.getElementById('clearPlayersBtn');
    const resetSessionBtn = document.getElementById('resetSessionBtn');
    const duplicateWarning = document.getElementById('duplicateWarning');
    const previewDiv = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const saveBookingBtn = document.getElementById('saveBookingBtn');
    const savedBookingsList = document.getElementById('savedBookingsList');
    const noBookingsMsg = document.getElementById('noBookingsMsg');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const importBtn = document.getElementById('importBtn');
    const importModal = document.getElementById('importModal');
    const importTextarea = document.getElementById('importTextarea');
    const importCancelBtn = document.getElementById('importCancelBtn');
    const importParseBtn = document.getElementById('importParseBtn');
    const importError = document.getElementById('importError');

    let players = [];

    function format12Hour(t) {
      if (!t) return "";
      const [h, m] = t.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return "";
      const ampm = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
    }

    function formatDateDMY(d) {
      if (!d) return "";
      const [y, m, day] = d.split('-');
      return `${parseInt(day)}/${parseInt(m)}/${y}`;
    }

    function getDayFromDate(d) {
      if (!d) return "";
      const date = new Date(d + "T00:00:00");
      const days = ["AHAD","ISNIN","SELASA","RABU","KHAMIS","JUMAAT","SABTU"];
      return days[date.getDay()];
    }

    function updateTotalHours() {
      const s = startTime.value;
      const e = endTime.value;
      if (!s || !e) { totalHoursSpan.textContent = '—'; return; }
      const [sh, sm] = s.split(':').map(Number);
      const [eh, em] = e.split(':').map(Number);
      if (isNaN(sh) || isNaN(sm) || isNaN(eh) || isNaN(em)) { totalHoursSpan.textContent = '—'; return; }
      let startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin <= startMin) endMin += 24 * 60;
      const diffMin = endMin - startMin;
      const hours = diffMin / 60;
      totalHoursSpan.textContent = (hours % 1 === 0) ? `${hours} hour(s)` : `${hours.toFixed(1)} hours`;
    }

    const today = new Date().toISOString().slice(0,10);
    dateInput.value = today;
    dayInput.value = getDayFromDate(today);
    dateInput.addEventListener('change', () => dayInput.value = getDayFromDate(dateInput.value));
    startTime.addEventListener('input', () => { updateTotalHours(); updatePreview(); });
    endTime.addEventListener('input', () => { updateTotalHours(); updatePreview(); });
    updateTotalHours();

    const savedAutoCount = localStorage.getItem('autoAddCount');
    if (savedAutoCount) autoAddCount.value = savedAutoCount;

    function findDuplicates() {
      const names = players.map(p => p.name.trim().toLowerCase()).filter(n => n);
      const dups = new Set();
      const seen = new Set();
      names.forEach(n => { if (seen.has(n)) dups.add(n); else seen.add(n); });
      return dups;
    }

    function renderPlayers() {
      playersContainer.innerHTML = '';
      const dups = findDuplicates();
      let hasDup = false;
      players.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        const nameLow = p.name.trim().toLowerCase();
        const isDup = nameLow && dups.has(nameLow);
        if (isDup) { row.classList.add('duplicate'); hasDup = true; }
        row.innerHTML = `
          <span class="num">${idx+1}.</span>
          <input type="text" class="pname" value="${escapeHtml(p.name)}" placeholder="Name" data-idx="${idx}">
          <button class="paid-btn ${p.paid?'paid':''}" data-idx="${idx}">✅</button>
          <button class="remove-btn" data-idx="${idx}">✕</button>
        `;
        playersContainer.appendChild(row);
      });
      duplicateWarning.classList.toggle('active', hasDup);

      document.querySelectorAll('.pname').forEach(inp => {
        inp.addEventListener('input', e => {
          const i = e.target.dataset.idx;
          players[i].name = e.target.value;
          renderPlayers();
          updatePreview();
        });
      });
      document.querySelectorAll('.paid-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          const i = e.target.dataset.idx;
          players[i].paid = !players[i].paid;
          renderPlayers();
          updatePreview();
        });
      });
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          players.splice(parseInt(e.target.dataset.idx), 1);
          renderPlayers();
          updatePreview();
        });
      });
    }

    addPlayerBtn.onclick = () => { players.push({name:"",paid:false}); renderPlayers(); updatePreview(); };
    autoAddBtn.onclick = () => {
      let n = parseInt(autoAddCount.value);
      if (isNaN(n) || n<1) { alert("Enter a valid number"); return; }
      if (n>100) n=100;
      localStorage.setItem('autoAddCount', n);
      for (let i=0; i<n; i++) players.push({name:"",paid:false});
      renderPlayers(); updatePreview(); autoAddCount.value = '';
    };
    clearPlayersBtn.onclick = () => {
      if (players.length && confirm('Remove all players?')) { players=[]; renderPlayers(); updatePreview(); }
    };
    resetSessionBtn.onclick = () => {
      if (confirm('Reset session? Venue will be kept.')) {
        const t = new Date().toISOString().slice(0,10);
        dateInput.value = t; dayInput.value = getDayFromDate(t);
        startTime.value = "21:30"; endTime.value = "23:30"; updateTotalHours();
        court.value = ""; price.value = ""; shuttle.value = ""; host.value = "";
        players = []; renderPlayers(); updatePreview();
      }
    };

    function buildPreviewText() {
      const d = formatDateDMY(dateInput.value) || ".........";
      const day = dayInput.value || ".......";
      const s = format12Hour(startTime.value) || ".....";
      const e = format12Hour(endTime.value) || ".....";
      const v = venue.value || "................";
      const c = court.value || "................";
      const pr = price.value || "0";
      const sh = shuttle.value || "......";
      const h = host.value.trim() || "......";
      const totalText = totalHoursSpan.textContent;
      const valid = (totalText !== '—');
      const totalLine = valid ? `⏱️ Total: ${totalText}\n` : '';

      let txt = `📆 : ${d} , ${day}\n`;
      txt += `⏰ : ${s} - ${e}\n`;
      txt += totalLine;
      txt += `🏟️ : ${v}\n        (${c})\n`;
      txt += `💵 : RM${pr} Per player\n\n`;
      txt += `🏸: Shuttle: ${sh}\n\n`;
      txt += `Done payment sila tick ✅ ‼️\n\n`;
      txt += `Host ${h}\n\n`;
      players.forEach((p,i) => {
        const name = p.name.trim() || "(Open)";
        txt += `${i+1}. ${name}${p.paid?'✅️':''}\n`;
      });
      return txt;
    }

    function updatePreview() { previewDiv.innerHTML = `<pre>${buildPreviewText()}</pre>`; }

    copyBtn.onclick = async () => {
      const txt = buildPreviewText();
      try { await navigator.clipboard.writeText(txt); alert("✅ Copied!"); }
      catch { const ta = document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert("✅ Copied!"); }
    };

    importBtn.onclick = () => {
      importModal.classList.remove('hidden');
      importTextarea.value = '';
      importError.style.display = 'none';
      importTextarea.focus();
    };
    importCancelBtn.onclick = () => importModal.classList.add('hidden');

    function parseTime12to24(str) {
      const match = str.match(/^(\d{1,2})\.(\d{2})(am|pm)$/i);
      if (!match) return null;
      let h = parseInt(match[1]);
      const m = match[2];
      const period = match[3].toLowerCase();
      if (period === 'pm' && h !== 12) h += 12;
      if (period === 'am' && h === 12) h = 0;
      return `${h.toString().padStart(2,'0')}:${m}`;
    }

    function parseDMYtoYMD(str) {
      const parts = str.split('/');
      if (parts.length !== 3) return null;
      const day = parts[0].padStart(2,'0');
      const month = parts[1].padStart(2,'0');
      const year = parts[2];
      return `${year}-${month}-${day}`;
    }

    importParseBtn.onclick = () => {
      const raw = importTextarea.value.trim();
      importError.style.display = 'none';
      if (!raw) { importError.textContent = 'Please paste an announcement.'; importError.style.display = 'block'; return; }

      try {
        const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');
        let parsedDate = '', parsedDay = '', parsedStart = '', parsedEnd = '';
        let parsedVenue = '', parsedCourt = '', parsedPrice = '', parsedShuttle = '', parsedHost = '';
        const parsedPlayers = [];

        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          if (line.startsWith('📆')) {
            const match = line.match(/📆\s*:\s*(.+?)\s*,\s*(.+)/);
            if (match) {
              const dateDMY = match[1].trim();
              parsedDay = match[2].trim();
              const ymd = parseDMYtoYMD(dateDMY);
              if (ymd) parsedDate = ymd;
            }
          } else if (line.startsWith('⏰')) {
            const match = line.match(/⏰\s*:\s*(.+?)\s*-\s*(.+)/);
            if (match) {
              const start24 = parseTime12to24(match[1].trim());
              const end24 = parseTime12to24(match[2].trim());
              if (start24) parsedStart = start24;
              if (end24) parsedEnd = end24;
            }
          } else if (line.startsWith('🏟️')) {
            const match = line.match(/🏟️\s*:\s*(.+)/);
            if (match) parsedVenue = match[1].trim();
            if (i+1 < lines.length && lines[i+1].startsWith('(')) {
              const courtMatch = lines[i+1].match(/\((.+)\)/);
              if (courtMatch) parsedCourt = courtMatch[1].trim();
              i++;
            }
          } else if (line.startsWith('💵')) {
            const match = line.match(/💵\s*:\s*RM([\d.]+)/);
            if (match) parsedPrice = match[1];
          } else if (line.startsWith('🏸')) {
            const match = line.match(/🏸:\s*Shuttle:\s*(.+)/);
            if (match) parsedShuttle = match[1].trim();
          } else if (line.startsWith('Host ')) {
            const match = line.match(/^Host\s+(.+)/);
            if (match) parsedHost = match[1].trim();
          } else if (/^\d+\./.test(line)) {
            const match = line.match(/^(\d+)\.\s*(.+)$/);
            if (match) {
              let name = match[2].trim();
              const paid = name.endsWith('✅️') || name.endsWith('✅');
              if (paid) name = name.slice(0, - (name.endsWith('✅️')?2:1)).trim();
              if (name === '(Open)' || name === '') name = '';
              parsedPlayers.push({ name, paid });
            }
          }
          i++;
        }

        if (parsedDate) {
          dateInput.value = parsedDate;
          dayInput.value = parsedDay || getDayFromDate(parsedDate);
        }
        if (parsedStart) startTime.value = parsedStart;
        if (parsedEnd) endTime.value = parsedEnd;
        updateTotalHours();
        if (parsedVenue) venue.value = parsedVenue;
        if (parsedCourt) court.value = parsedCourt;
        if (parsedPrice) price.value = parsedPrice;
        if (parsedShuttle) shuttle.value = parsedShuttle;
        if (parsedHost) host.value = parsedHost;
        if (parsedPlayers.length > 0) players = parsedPlayers;
        else players = [];
        renderPlayers();
        updatePreview();
        importModal.classList.add('hidden');
      } catch (err) {
        importError.textContent = 'Could not parse the announcement. Please check the format.';
        importError.style.display = 'block';
      }
    };

    const STORAGE_KEY = 'badminton_bookings';
    const getBookings = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; } catch { return []; } };
    const saveBookings = (b) => localStorage.setItem(STORAGE_KEY, JSON.stringify(b));

    function addBooking(data) { const bookings = getBookings(); bookings.push(data); saveBookings(bookings); renderSaved(); }
    function deleteBooking(i) { const bookings = getBookings(); bookings.splice(i,1); saveBookings(bookings); renderSaved(); }

    function renderSaved() {
      const bookings = getBookings();
      savedBookingsList.innerHTML = '';
      if (!bookings.length) { noBookingsMsg.classList.remove('hidden'); return; }
      noBookingsMsg.classList.add('hidden');
      bookings.forEach((b, idx) => {
        const div = document.createElement('div');
        div.className = 'booking-list-item';
        div.innerHTML = `
          <div style="flex:1;"><strong>📅 ${b.date||''} ${b.day||''}</strong><br><small>${escapeHtml(b.text.split('\n').slice(0,3).join(' | '))} ...</small></div>
          <div style="display:flex; gap:6px;">
            <button class="secondary load-booking" data-idx="${idx}" style="padding:8px 12px;">Load</button>
            <button class="danger delete-booking" data-idx="${idx}" style="padding:8px 12px;">Del</button>
          </div>
        `;
        savedBookingsList.appendChild(div);
      });
      document.querySelectorAll('.load-booking').forEach(btn => btn.onclick = () => {
        const b = getBookings()[btn.dataset.idx];
        if (b) loadBooking(b);
      });
      document.querySelectorAll('.delete-booking').forEach(btn => btn.onclick = () => {
        if (confirm('Delete?')) deleteBooking(btn.dataset.idx);
      });
    }

    function loadBooking(b) {
      dateInput.value = b.date || ''; dayInput.value = b.day || '';
      startTime.value = b.start || ''; endTime.value = b.end || ''; updateTotalHours();
      venue.value = b.venue || ''; court.value = b.court || ''; price.value = b.price || '';
      shuttle.value = b.shuttle || ''; host.value = b.host || '';
      players = b.players ? JSON.parse(JSON.stringify(b.players)) : [];
      renderPlayers(); updatePreview(); window.scrollTo({top:0,behavior:'smooth'});
    }

    saveBookingBtn.onclick = () => {
      addBooking({
        date: dateInput.value, day: dayInput.value, start: startTime.value, end: endTime.value,
        venue: venue.value, court: court.value, price: price.value, shuttle: shuttle.value,
        host: host.value, players: JSON.parse(JSON.stringify(players)),
        text: buildPreviewText(), savedAt: new Date().toISOString()
      });
      alert("💾 Saved!");
    };
    clearAllBtn.onclick = () => { if (confirm('Delete all?')) { localStorage.removeItem(STORAGE_KEY); renderSaved(); } };

    function escapeHtml(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    renderPlayers();
    updatePreview();
    renderSaved();
  })();
</script>
</body>
</html>
