<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏸 Badminton Slot Booking</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 700px; width: 100%; }
    h1 { text-align: center; color: #1e3c72; margin-bottom: 0.3em; }
    .subtitle { text-align: center; color: #555; margin-bottom: 1.5em; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 4px; }
    .form-group.full { grid-column: span 2; }
    label { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; color: #333; }
    input, textarea, select { padding: 10px 12px; border: 1px solid #dce1e8; border-radius: 8px; font-size: 0.95rem; background: #fafbfc; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30,136,229,0.15); }
    button { background: #1e88e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
    button:hover { background: #1565c0; }
    button.secondary { background: #e9eef2; color: #1e3c72; }
    button.secondary:hover { background: #dce4ec; }
    button.danger { background: #ef5350; }
    button.danger:hover { background: #d32f2f; }
    .players-section { margin: 20px 0 10px; }
    .player-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: #f8fafc; padding: 8px 12px; border-radius: 10px; }
    .player-row .num { font-weight: 700; width: 28px; color: #1e3c72; }
    .player-row input { flex: 1; }
    .player-row .paid-btn { background: none; border: 2px solid #dce1e8; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 1rem; cursor: pointer; background: white; transition: 0.2s; color: #666; min-width: 44px; }
    .player-row .paid-btn.paid { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
    .player-row .remove-btn { background: none; border: none; color: #999; font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .player-row .remove-btn:hover { background: #fee2e2; color: #d32f2f; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
    .preview-box { background: #f1f5f9; border-radius: 12px; padding: 20px; border: 1px dashed #94a3b8; margin-top: 10px; }
    .preview-box pre { white-space: pre-wrap; font-family: monospace; font-size: 0.95rem; line-height: 1.6; color: #1e293b; margin: 0; }
    .booking-list-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 5px solid #1e88e5; display: flex; justify-content: space-between; align-items: center; }
    .booking-list-item .info { font-size: 0.9rem; }
    .hidden { display: none; }
    .auto-add-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .auto-add-row input { width: 80px; text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <h1>🏸 Badminton Slot Booking</h1>
  <p class="subtitle">Create your booking and copy the announcement</p>

  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label>📆 Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label>Day (auto)</label>
        <input type="text" id="dayInput" placeholder="Auto-filled" readonly>
      </div>
      <div class="form-group">
        <label>⏰ Start Time</label>
        <input type="time" id="startTime" value="21:30">
      </div>
      <div class="form-group">
        <label>End Time</label>
        <input type="time" id="endTime" value="23:30">
      </div>
      <div class="form-group full">
        <label>🏟️ Venue</label>
        <input type="text" id="venue" value="Forum Sba, Setia Alam" placeholder="Venue name & location">
      </div>
      <div class="form-group full">
        <label>Court Details (Rubber Court 6 & 7, etc.)</label>
        <input type="text" id="court" value="Rubber Court 6 & 7" placeholder="Court numbers / type">
      </div>
      <div class="form-group">
        <label>💵 Price per player (RM)</label>
        <input type="number" id="price" value="17" step="0.5" min="0">
      </div>
      <div class="form-group">
        <label>🏸 Shuttle brand</label>
        <input type="text" id="shuttle" value="RSL" placeholder="e.g. RSL, Yonex AS30">
      </div>
      <div class="form-group full">
        <label>👤 Host name</label>
        <input type="text" id="host" value="" placeholder="Host name">
      </div>
    </div>

    <div class="players-section">
      <label style="font-weight:600;">👥 Players (click ✅ to mark paid)</label>
      <div id="playersContainer"></div>

      <!-- Manual add + Auto add section -->
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px;">
        <button class="secondary" id="addPlayerBtn">+ Add Player Slot</button>
        <div class="auto-add-row">
          <input type="number" id="autoAddCount" placeholder="e.g. 6" min="1" value="6" style="width:70px;">
          <button id="autoAddBtn" class="secondary">Auto Add Slots</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="copyBtn" class="secondary">📋 Copy Announcement</button>
      <button id="saveBookingBtn">💾 Save Booking</button>
    </div>

    <div>
      <label style="font-weight:600;">📄 Announcement Preview:</label>
      <div class="preview-box" id="preview"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">📂 Saved Bookings</h3>
    <div id="savedBookingsList"></div>
    <p id="noBookingsMsg" style="color:#777;">No saved bookings yet.</p>
    <button id="clearAllBtn" class="danger" style="margin-top:8px;">🗑️ Clear All Saved</button>
  </div>
</div>

<script>
  (function() {
    // ---------- DOM ----------
    const dateInput = document.getElementById('dateInput');
    const dayInput = document.getElementById('dayInput');
    const startTime = document.getElementById('startTime');
    const endTime = document.getElementById('endTime');
    const venue = document.getElementById('venue');
    const court = document.getElementById('court');
    const price = document.getElementById('price');
    const shuttle = document.getElementById('shuttle');
    const host = document.getElementById('host');
    const playersContainer = document.getElementById('playersContainer');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const autoAddCount = document.getElementById('autoAddCount');
    const autoAddBtn = document.getElementById('autoAddBtn');
    const previewDiv = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const saveBookingBtn = document.getElementById('saveBookingBtn');
    const savedBookingsList = document.getElementById('savedBookingsList');
    const noBookingsMsg = document.getElementById('noBookingsMsg');
    const clearAllBtn = document.getElementById('clearAllBtn');

    // Players start empty
    let players = [];

    // ---------- Helpers ----------
    function format12Hour(time24) {
      if (!time24) return "";
      const [h, m] = time24.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return "";
      const ampm = h >= 12 ? 'PM' : 'AM';
      let hour12 = h % 12;
      if (hour12 === 0) hour12 = 12;
      return `${hour12}:${m.toString().padStart(2, '0')} ${ampm}`;
    }

    function formatDateDMY(dateStr) {
      if (!dateStr) return "";
      const [year, month, day] = dateStr.split('-');
      return `${parseInt(day)}/${parseInt(month)}/${year}`;
    }

    function getDayFromDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T00:00:00");
      const days = ["AHAD", "ISNIN", "SELASA", "RABU", "KHAMIS", "JUMAAT", "SABTU"];
      return days[d.getDay()];
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Auto‑select today's date
    const today = new Date().toISOString().slice(0,10);
    dateInput.value = today;
    dayInput.value = getDayFromDate(today);
    dateInput.addEventListener('change', () => {
      dayInput.value = getDayFromDate(dateInput.value);
    });

    // ---------- Players ----------
    function renderPlayers() {
      playersContainer.innerHTML = '';
      players.forEach((player, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
          <span class="num">${idx + 1}.</span>
          <input type="text" class="player-name" value="${escapeHtml(player.name)}" placeholder="Player name" data-index="${idx}">
          <button class="paid-btn ${player.paid ? 'paid' : ''}" data-index="${idx}" title="Toggle paid">✅</button>
          <button class="remove-btn" data-index="${idx}" title="Remove player">✕</button>
        `;
        playersContainer.appendChild(row);
      });

      document.querySelectorAll('.player-name').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = e.target.dataset.index;
          players[idx].name = e.target.value;
          updatePreview();
        });
      });

      document.querySelectorAll('.paid-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          players[idx].paid = !players[idx].paid;
          renderPlayers();
          updatePreview();
        });
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.index);
          players.splice(idx, 1);
          renderPlayers();
          updatePreview();
        });
      });
    }

    // Manual add one
    addPlayerBtn.addEventListener('click', () => {
      players.push({ name: "", paid: false });
      renderPlayers();
      updatePreview();
    });

    // Auto add multiple slots
    autoAddBtn.addEventListener('click', () => {
      let count = parseInt(autoAddCount.value);
      if (isNaN(count) || count < 1) {
        alert("Please enter a valid number (e.g., 6).");
        return;
      }
      // Limit to avoid accidental huge numbers
      if (count > 100) {
        alert("Maximum 100 slots at a time.");
        count = 100;
      }
      for (let i = 0; i < count; i++) {
        players.push({ name: "", paid: false });
      }
      renderPlayers();
      updatePreview();
      autoAddCount.value = ''; // clear the input for next use
    });

    // ---------- Preview ----------
    function buildPreviewText() {
      const dateVal = formatDateDMY(dateInput.value) || ".........";
      const dayVal = dayInput.value || ".......";
      const start = format12Hour(startTime.value) || ".....";
      const end = format12Hour(endTime.value) || ".....";
      const venueVal = venue.value || "................";
      const courtVal = court.value || "................";
      const priceVal = price.value || "0";
      const shuttleVal = shuttle.value || "......";
      const hostVal = host.value.trim() || "......";

      let text = `📆 : ${dateVal} , ${dayVal}\n`;
      text += `⏰ : ${start} - ${end}\n`;
      text += `🏟️ : ${venueVal}\n`;
      text += `        (${courtVal})\n`;
      text += `💵 : RM${priceVal} Per player\n\n`;
      text += `🏸: Shuttle: ${shuttleVal}\n\n`;
      text += `Done payment sila tick ✅ ‼️\n\n`;
      text += `Host ${hostVal}\n\n`;

      players.forEach((p, i) => {
        const num = i + 1;
        const name = p.name.trim() || "(Open)";
        const paidMark = p.paid ? "✅️" : "";
        text += `${num}. ${name}${paidMark}\n`;
      });

      return text;
    }

    function updatePreview() {
      previewDiv.innerHTML = `<pre>${buildPreviewText()}</pre>`;
    }

    copyBtn.addEventListener('click', async () => {
      const text = buildPreviewText();
      try {
        await navigator.clipboard.writeText(text);
        alert("✅ Text copied!");
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert("✅ Text copied!");
      }
    });

    // ---------- Save / Load bookings ----------
    const STORAGE_KEY = 'badminton_bookings';

    function getSavedBookings() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveBookingsToStorage(bookings) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
    }

    function addBookingToStorage(bookingData) {
      const bookings = getSavedBookings();
      bookings.push(bookingData);
      saveBookingsToStorage(bookings);
      renderSavedBookings();
    }

    function deleteBooking(index) {
      const bookings = getSavedBookings();
      bookings.splice(index, 1);
      saveBookingsToStorage(bookings);
      renderSavedBookings();
    }

    function renderSavedBookings() {
      const bookings = getSavedBookings();
      savedBookingsList.innerHTML = "";
      if (bookings.length === 0) {
        noBookingsMsg.classList.remove('hidden');
        return;
      }
      noBookingsMsg.classList.add('hidden');
      bookings.forEach((b, idx) => {
        const div = document.createElement('div');
        div.className = 'booking-list-item';
        const shortPreview = b.text.split('\n').slice(0, 4).join(' | ');
        div.innerHTML = `
          <div class="info">
            <strong>📅 ${b.date || '...'} ${b.day || ''}</strong><br>
            <small>${escapeHtml(shortPreview)} ...</small>
          </div>
          <div>
            <button class="secondary load-booking" data-index="${idx}">📂 Load</button>
            <button class="danger delete-booking" data-index="${idx}">🗑️</button>
          </div>
        `;
        savedBookingsList.appendChild(div);
      });

      document.querySelectorAll('.load-booking').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          const bookings = getSavedBookings();
          const booking = bookings[idx];
          if (booking) loadBooking(booking);
        });
      });
      document.querySelectorAll('.delete-booking').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = e.target.dataset.index;
          if (confirm('Delete this booking?')) deleteBooking(idx);
        });
      });
    }

    function loadBooking(booking) {
      dateInput.value = booking.date || '';
      dayInput.value = booking.day || '';
      startTime.value = booking.start || '';
      endTime.value = booking.end || '';
      venue.value = booking.venue || '';
      court.value = booking.court || '';
      price.value = booking.price || '';
      shuttle.value = booking.shuttle || '';
      host.value = booking.host || '';
      players = booking.players ? JSON.parse(JSON.stringify(booking.players)) : [];
      renderPlayers();
      updatePreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    saveBookingBtn.addEventListener('click', () => {
      const bookingData = {
        date: dateInput.value,
        day: dayInput.value,
        start: startTime.value,
        end: endTime.value,
        venue: venue.value,
        court: court.value,
        price: price.value,
        shuttle: shuttle.value,
        host: host.value,
        players: JSON.parse(JSON.stringify(players)),
        text: buildPreviewText(),
        savedAt: new Date().toISOString()
      };
      addBookingToStorage(bookingData);
      alert("💾 Booking saved to browser!");
    });

    clearAllBtn.addEventListener('click', () => {
      if (confirm('Delete ALL saved bookings?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderSavedBookings();
      }
    });

    // ---------- Init ----------
    renderPlayers();
    updatePreview();
    renderSavedBookings();
  })();
</script>
</body>
</html>
